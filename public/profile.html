<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — for heal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fafafa;
            color: #2d2d2d;
            font-family: 'Nunito', sans-serif;
            line-height: 1.7;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0.85); }
            60%  { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%       { transform: scale(1.4); opacity: 0.7; }
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* PAGE TRANSITION */
        .page-transition {
            position: fixed; inset: 0;
            background: #fafafa;
            z-index: 9998;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .page-transition.active { opacity: 1; pointer-events: all; }

        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f0ece8;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: fadeUp 0.4s ease both;
        }
        nav .logo {
            font-size: 19px;
            font-weight: 800;
            color: #2d2d2d;
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        nav .logo:hover { opacity: 0.7; }
        .btn {
            background: #2d2d2d;
            color: #fff !important;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
            font-family: 'Nunito', sans-serif;
            border: none;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.75; transform: translateY(-1px); }
        .btn:active { transform: scale(0.96); }
        .btn-outline {
            background: transparent;
            color: #888 !important;
            border: 1.5px solid #ddd;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
        }
        .btn-outline:hover { border-color: #999; color: #444 !important; transform: translateY(-1px); }

        /* SKELETON */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 10px;
        }

        /* PROFILE HEADER */
        .profile-header {
            max-width: 680px;
            margin: 0 auto;
            padding: 48px 24px 0;
        }

        .profile-top {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.5s ease 0.15s forwards;
        }

        .avatar-wrap { position: relative; flex-shrink: 0; }

        .avatar {
            width: 88px; height: 88px;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #f4845f, #f7b731);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            overflow: hidden;
            animation: popIn 0.5s ease 0.2s both;
            transition: transform 0.3s ease;
        }
        .avatar:hover { transform: scale(1.05); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .avatar-edit-btn {
            position: absolute;
            bottom: 0; right: 0;
            width: 26px; height: 26px;
            background: #2d2d2d;
            border-radius: 50%;
            border: 2px solid #fafafa;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .avatar-edit-btn:hover { transform: scale(1.1); }

        .profile-info { flex: 1; min-width: 0; }

        .profile-username {
            font-size: 24px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .profile-joined { font-size: 12px; color: #bbb; font-weight: 600; margin-bottom: 10px; }
        .profile-bio { font-size: 14px; color: #666; font-weight: 500; line-height: 1.6; }
        .profile-bio-empty { font-size: 13px; color: #ccc; font-style: italic; font-weight: 500; }

        .profile-stats {
            display: flex;
            gap: 24px;
            padding: 20px 0;
            border-top: 1px solid #f0ece8;
            border-bottom: 1px solid #f0ece8;
            opacity: 0;
            animation: fadeUp 0.5s ease 0.3s forwards;
        }

        .stat-item {
            text-align: center;
            transition: transform 0.2s;
            cursor: default;
        }
        .stat-item:hover { transform: translateY(-2px); }
        .stat-num {
            font-size: 22px;
            font-weight: 900;
            color: #1a1a1a;
            display: block;
            animation: countUp 0.5s ease 0.5s both;
        }
        .stat-label { font-size: 11px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .edit-profile-btn { display: none; margin-top: 16px; animation: fadeUp 0.4s ease 0.4s both; }

        /* TABS */
        .tabs {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            border-bottom: 1px solid #f0ece8;
            margin-top: 24px;
            opacity: 0;
            animation: fadeUp 0.4s ease 0.35s forwards;
        }
        .tab-btn {
            background: none; border: none;
            padding: 12px 20px;
            font-size: 13px; font-weight: 700;
            color: #bbb; cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.3px;
        }
        .tab-btn.active { color: #2d2d2d; border-bottom-color: #2d2d2d; }
        .tab-btn:hover:not(.active) { color: #888; }

        /* CONTENT */
        .tab-content { max-width: 680px; margin: 0 auto; padding: 32px 24px 80px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeUp 0.3s ease; }

        /* ARTICLE CARD */
        .post-card {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 20px 0;
            border-bottom: 1px solid #f4f0ec;
            cursor: pointer;
            transition: transform 0.2s;
            opacity: 0;
            transform: translateY(16px);
        }
        .post-card.visible { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease; }
        .post-card:hover { transform: translateX(4px); }

        .post-thumb { width: 80px; height: 80px; border-radius: 14px; object-fit: cover; flex-shrink: 0; transition: transform 0.3s; }
        .post-card:hover .post-thumb { transform: scale(1.04); }
        .post-thumb-placeholder { width: 80px; height: 80px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; transition: transform 0.3s; }
        .post-card:hover .post-thumb-placeholder { transform: scale(1.04); }
        .post-body { flex: 1; min-width: 0; }
        .post-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 4px; }
        .tag-refleksi { color: #e05060; }
        .tag-cerita   { color: #3b9dcf; }
        .tag-opini    { color: #8059d0; }
        .tag-lifestyle{ color: #c07020; }
        .tag-default  { color: #888; }
        .post-card h3 { font-size: 16px; font-weight: 800; color: #1a1a1a; margin-bottom: 4px; line-height: 1.3; }
        .post-excerpt { color: #aaa; font-size: 13px; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .post-meta { font-size: 11px; color: #ccc; font-weight: 600; margin-top: 8px; }

        /* TIL CARD */
        .til-card {
            background: #fff;
            border: 1px solid #f0ece8;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(16px);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .til-card.visible { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, box-shadow 0.2s; }
        .til-card:hover { border-color: #90ddb8; transform: translateX(3px); box-shadow: 0 4px 12px rgba(45,158,107,0.08); }
        .til-card p { font-size: 14px; color: #444; font-weight: 500; line-height: 1.6; }
        .til-card .til-date { font-size: 11px; color: #ccc; font-weight: 600; margin-top: 8px; }

        /* QUOTE CARD */
        .quote-card {
            background: #fff;
            border: 1px solid #f0ece8;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(16px);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .quote-card.visible { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, box-shadow 0.2s; }
        .quote-card:hover { border-color: #c4a8f0; transform: translateX(3px); box-shadow: 0 4px 12px rgba(124,58,237,0.08); }
        .quote-text { font-size: 16px; font-weight: 700; color: #2d2d2d; line-height: 1.5; margin-bottom: 8px; }
        .quote-text::before { content: '"'; color: #f4845f; font-size: 24px; line-height: 0; vertical-align: -6px; margin-right: 2px; }
        .quote-text::after  { content: '"'; color: #f4845f; font-size: 24px; line-height: 0; vertical-align: -6px; margin-left: 2px; }
        .quote-author { font-size: 12px; color: #bbb; font-weight: 600; }

        .empty { text-align: center; color: #ccc; padding: 48px 0; font-size: 14px; font-weight: 600; }

        /* EDIT MODAL */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 24px;
            padding: 32px;
            width: 100%; max-width: 420px;
            animation: popIn 0.3s ease;
        }
        .modal h2 { font-size: 20px; font-weight: 900; margin-bottom: 24px; color: #1a1a1a; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #eee; border-radius: 12px;
            font-size: 14px; font-family: 'Nunito', sans-serif;
            color: #2d2d2d; background: #fafafa;
            outline: none; transition: border-color 0.2s; resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #2d2d2d; background: #fff; }
        .avatar-preview-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
        .avatar-preview {
            width: 60px; height: 60px; border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #f4845f, #f7b731);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900; color: #fff;
            overflow: hidden; flex-shrink: 0;
            transition: transform 0.2s;
        }
        .avatar-preview:hover { transform: scale(1.05); }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .file-input-label {
            display: inline-block; padding: 8px 16px;
            border: 1.5px dashed #ddd; border-radius: 10px;
            font-size: 13px; font-weight: 700; color: #888;
            cursor: pointer; transition: all 0.2s;
        }
        .file-input-label:hover { border-color: #aaa; color: #555; }
        #avatarFileInput { display: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .modal-actions .btn { flex: 1; text-align: center; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2d2d2d; color: #fff;
            padding: 12px 24px; border-radius: 30px;
            font-size: 13px; font-weight: 700;
            z-index: 999; transition: transform 0.3s ease;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* FOOTER DOTS */
        .footer-dots span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .footer-dots span:nth-child(1) { animation: pulseDot 1.8s ease-in-out 0s infinite; }
        .footer-dots span:nth-child(2) { animation: pulseDot 1.8s ease-in-out 0.2s infinite; }
        .footer-dots span:nth-child(3) { animation: pulseDot 1.8s ease-in-out 0.4s infinite; }
        .footer-dots span:nth-child(4) { animation: pulseDot 1.8s ease-in-out 0.6s infinite; }
        .footer-dots span:nth-child(5) { animation: pulseDot 1.8s ease-in-out 0.8s infinite; }

        footer { text-align: center; padding: 36px 20px; border-top: 1px solid #f0ece8; font-size: 13px; color: #bbb; font-weight: 600; }
        .footer-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 10px; }

        @media (max-width: 600px) {
            nav { padding: 14px 16px; backdrop-filter: none; background: rgba(255,255,255,0.98); }
            .profile-header { padding: 32px 16px 0; }
            .tabs { padding: 0 16px; }
            .tab-content { padding: 24px 16px 60px; }
            .profile-top { gap: 16px; }
            .avatar { width: 72px; height: 72px; font-size: 26px; }
            .profile-username { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="page-transition" id="pageTransition"></div>

<nav>
    <a href="index.html" class="logo" onclick="navigateTo(event,'index.html')">
        <svg width="30" height="30" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="#c97d4e" stroke-linecap="round" stroke-linejoin="round">
                <path d="M100 148 C80 132,56 116,56 92 C56 75,69 64,82 64 C89 64,96 68,100 74 C104 68,111 64,118 64 C131 64,144 75,144 92 C144 116,120 132,100 148Z" stroke-width="1.4" opacity="0.9"/>
            </g>
        </svg>
        for heal
    </a>
    <div id="navActions" style="display:flex;gap:8px;align-items:center;"></div>
</nav>

<div class="profile-header" id="profileHeader">
    <div class="profile-top">
        <div class="avatar-wrap">
            <div class="avatar" id="avatarEl"></div>
            <div class="avatar-edit-btn" id="avatarEditBtn" onclick="openEdit()">✏️</div>
        </div>
        <div class="profile-info">
            <div class="profile-username" id="profileUsername">—</div>
            <div class="profile-joined" id="profileJoined"></div>
            <div id="profileBio"></div>
        </div>
    </div>
    <div class="profile-stats">
        <div class="stat-item">
            <span class="stat-num" id="statArticles">0</span>
            <span class="stat-label">Artikel</span>
        </div>
        <div class="stat-item">
            <span class="stat-num" id="statTil">0</span>
            <span class="stat-label">TIL</span>
        </div>
        <div class="stat-item">
            <span class="stat-num" id="statQuotes">0</span>
            <span class="stat-label">Quotes</span>
        </div>
    </div>
    <div class="edit-profile-btn" id="editProfileBtn">
        <button class="btn-outline" onclick="openEdit()">✏️ Edit Profil</button>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('articles', this)">Artikel</button>
    <button class="tab-btn" onclick="switchTab('til', this)">TIL</button>
    <button class="tab-btn" onclick="switchTab('quotes', this)">Quotes</button>
</div>

<div class="tab-content">
    <div class="tab-panel active" id="panel-articles">
        <p class="empty" id="emptyArticles" style="display:none">Belum ada artikel.</p>
    </div>
    <div class="tab-panel" id="panel-til">
        <p class="empty" id="emptyTil" style="display:none">Belum ada TIL.</p>
    </div>
    <div class="tab-panel" id="panel-quotes">
        <p class="empty" id="emptyQuotes" style="display:none">Belum ada quotes.</p>
    </div>
</div>

<footer>
    <div class="footer-dots">
        <span style="background:#f7a8b8"></span>
        <span style="background:#f7b731"></span>
        <span style="background:#a8e6cf"></span>
        <span style="background:#a0c4ff"></span>
        <span style="background:#c9b1ff"></span>
    </div>
    <p>made with my hand — for heal</p>
</footer>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>Edit Profil</h2>
        <div class="form-group">
            <label>Foto Profil</label>
            <div class="avatar-preview-wrap">
                <div class="avatar-preview" id="modalAvatarPreview"></div>
                <label class="file-input-label" for="avatarFileInput">📷 Ganti foto</label>
                <input type="file" id="avatarFileInput" accept="image/*" onchange="previewAvatar(this)">
            </div>
        </div>
        <div class="form-group">
            <label>Bio</label>
            <textarea id="bioInput" rows="3" placeholder="Ceritain sedikit tentang kamu..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-outline" onclick="closeEdit()">Batal</button>
            <button class="btn" onclick="saveProfile()">Simpan</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const token  = localStorage.getItem('token');
    const myName = localStorage.getItem('username');
    const params = new URLSearchParams(location.search);
    const username = params.get('u') || myName;

    let profileData = null;
    let newAvatarFile = null;

    window.addEventListener('pageshow', () => {
        document.getElementById('pageTransition').classList.remove('active');
    });

    function navigateTo(e, url) {
        e.preventDefault();
        const overlay = document.getElementById('pageTransition');
        overlay.classList.add('active');
        setTimeout(() => location.href = url, 280);
    }

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

    const navActions = document.getElementById('navActions');
    if (token) {
        navActions.innerHTML = `
            <span style="color:#999;font-size:13px;font-weight:600;">👤 ${myName}</span>
            <button class="btn" onclick="logout()">Keluar</button>
        `;
    } else {
        navActions.innerHTML = `
            <a href="login.html" class="btn-outline">Masuk</a>
            <a href="register.html" class="btn">Daftar</a>
        `;
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        location.href = 'index.html';
    }

    const thumbs = [
        { bg: '#ffd6d6', emoji: '🔎' },
        { bg: '#d6eeff', emoji: '🐶' },
        { bg: '#fffbd6', emoji: '👻' },
        { bg: '#e8d6ff', emoji: '🐾' },
    ];
    const tagClass = { refleksi:'tag-refleksi', cerita:'tag-cerita', opini:'tag-opini', lifestyle:'tag-lifestyle' };

    // Count up animation
    function animateCount(el, target) {
        let current = 0;
        const step = Math.ceil(target / 20);
        const interval = setInterval(() => {
            current = Math.min(current + step, target);
            el.textContent = current;
            if (current >= target) clearInterval(interval);
        }, 40);
    }

    async function loadProfile() {
        try {
            const res = await fetch(`/api/user/${username}`);
            if (!res.ok) { document.getElementById('profileUsername').textContent = 'User tidak ditemukan'; return; }
            profileData = await res.json();

            document.getElementById('profileUsername').textContent = profileData.username;
            document.title = `${profileData.username} — for heal`;

            const joined = new Date(profileData.created_at);
            document.getElementById('profileJoined').textContent =
                'Bergabung ' + joined.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

            const bioEl = document.getElementById('profileBio');
            bioEl.innerHTML = profileData.bio
                ? `<p class="profile-bio">${profileData.bio}</p>`
                : `<p class="profile-bio-empty">belum ada bio</p>`;

            renderAvatar(document.getElementById('avatarEl'), profileData);

            // Count up animation for stats
            animateCount(document.getElementById('statArticles'), profileData.articles.length);
            animateCount(document.getElementById('statTil'), profileData.til.length);
            animateCount(document.getElementById('statQuotes'), profileData.quotes.length);

            if (token && myName === username) {
                document.getElementById('editProfileBtn').style.display = 'block';
                document.getElementById('avatarEditBtn').style.display  = 'flex';
            }

            renderArticles(profileData.articles);
            renderTil(profileData.til);
            renderQuotes(profileData.quotes);

        } catch(e) { console.error(e); }
    }

    function renderAvatar(el, data) {
        if (data.avatar_url) {
            el.innerHTML = `<img src="${data.avatar_url}" alt="${data.username}">`;
        } else {
            el.textContent = data.username.charAt(0).toUpperCase();
        }
    }

    function renderArticles(articles) {
        const panel = document.getElementById('panel-articles');
        if (!articles.length) { document.getElementById('emptyArticles').style.display = 'block'; return; }
        panel.innerHTML = articles.map((a, i) => {
            const key = (a.tag || '').toLowerCase();
            const cls = tagClass[key] || 'tag-default';
            const t   = thumbs[i % thumbs.length];
            const img = a.image_url
                ? `<img src="${a.image_url}" class="post-thumb">`
                : `<div class="post-thumb-placeholder" style="background:${t.bg}">${t.emoji}</div>`;
            return `
            <div class="post-card" data-url="artikel.html?id=${a.id}">
                ${img}
                <div class="post-body">
                    <p class="post-tag ${cls}">${a.tag || 'umum'}</p>
                    <h3>${a.title}</h3>
                    <p class="post-excerpt">${a.content.substring(0, 100)}...</p>
                    <div class="post-meta">📅 ${a.date}</div>
                </div>
            </div>`;
        }).join('');
        panel.querySelectorAll('.post-card').forEach(card => {
            observer.observe(card);
            card.addEventListener('click', () => {
                const overlay = document.getElementById('pageTransition');
                overlay.classList.add('active');
                setTimeout(() => location.href = card.dataset.url, 280);
            });
        });
    }

    function renderTil(tils) {
        const panel = document.getElementById('panel-til');
        if (!tils.length) { document.getElementById('emptyTil').style.display = 'block'; return; }
        panel.innerHTML = tils.map((t, i) => `
            <div class="til-card">
                <p>${t.content}</p>
                <div class="til-date">📅 ${t.date}</div>
            </div>`).join('');
        panel.querySelectorAll('.til-card').forEach(c => observer.observe(c));
    }

    function renderQuotes(quotes) {
        const panel = document.getElementById('panel-quotes');
        if (!quotes.length) { document.getElementById('emptyQuotes').style.display = 'block'; return; }
        panel.innerHTML = quotes.map((q, i) => `
            <div class="quote-card">
                <div class="quote-text">${q.content}</div>
                ${q.author ? `<div class="quote-author">— ${q.author}</div>` : ''}
            </div>`).join('');
        panel.querySelectorAll('.quote-card').forEach(c => observer.observe(c));
    }

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + name).classList.add('active');
        // Re-observe after tab switch
        setTimeout(() => {
            document.querySelectorAll(`#panel-${name} .post-card, #panel-${name} .til-card, #panel-${name} .quote-card`).forEach(c => {
                if (!c.classList.contains('visible')) observer.observe(c);
            });
        }, 50);
    }

    function openEdit() {
        document.getElementById('bioInput').value = profileData?.bio || '';
        const prev = document.getElementById('modalAvatarPreview');
        if (profileData?.avatar_url) {
            prev.innerHTML = `<img src="${profileData.avatar_url}">`;
        } else {
            prev.textContent = (profileData?.username || '?').charAt(0).toUpperCase();
            prev.style.background = 'linear-gradient(135deg, #f4845f, #f7b731)';
        }
        document.getElementById('editModal').classList.add('open');
    }

    function closeEdit() {
        document.getElementById('editModal').classList.remove('open');
        newAvatarFile = null;
    }

    function previewAvatar(input) {
        if (!input.files[0]) return;
        newAvatarFile = input.files[0];
        const reader = new FileReader();
        reader.onload = e => {
            const prev = document.getElementById('modalAvatarPreview');
            prev.innerHTML = `<img src="${e.target.result}">`;
        };
        reader.readAsDataURL(newAvatarFile);
    }

    async function saveProfile() {
        const bio = document.getElementById('bioInput').value.trim();
        const saveBtn = document.querySelector('.modal-actions .btn');
        saveBtn.textContent = 'Menyimpan...';
        saveBtn.style.opacity = '0.7';

        const formData = new FormData();
        formData.append('bio', bio);
        if (newAvatarFile) formData.append('avatar', newAvatarFile);

        try {
            const res = await fetch('/api/user/profile', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            const data = await res.json();
            saveBtn.textContent = 'Simpan';
            saveBtn.style.opacity = '1';
            if (!res.ok) { showToast(data.message || 'Gagal'); return; }

            profileData = { ...profileData, ...data.user };
            const bioEl = document.getElementById('profileBio');
            bioEl.innerHTML = profileData.bio
                ? `<p class="profile-bio">${profileData.bio}</p>`
                : `<p class="profile-bio-empty">belum ada bio</p>`;
            const avatarEl = document.getElementById('avatarEl');
            avatarEl.style.animation = 'popIn 0.4s ease';
            renderAvatar(avatarEl, profileData);
            closeEdit();
            showToast('✅ Profil diupdate!');
        } catch {
            saveBtn.textContent = 'Simpan';
            saveBtn.style.opacity = '1';
            showToast('Gagal menyimpan');
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeEdit();
    });

    loadProfile();
</script>
</body>
</html>
