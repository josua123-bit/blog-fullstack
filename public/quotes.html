<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Quote Highlight — for heal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            color: #2d2d2d;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f0ece8;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .logo {
            font-size: 19px;
            font-weight: 800;
            color: #2d2d2d;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        nav .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-decoration: none;
            border: 1.5px solid #ddd;
            border-radius: 20px;
            padding: 7px 16px;
            transition: all 0.2s;
        }
        nav .back:hover { border-color: #999; color: #444; }

        /* PAGE HEADER */
        .page-header {
            background:
                radial-gradient(ellipse 55% 60% at 5% 0%, #f5f0ff 0%, transparent 65%),
                radial-gradient(ellipse 45% 50% at 95% 0%, #fce4ec 0%, transparent 65%),
                radial-gradient(ellipse 40% 40% at 50% 100%, #f3e8ff 0%, transparent 65%),
                #fafafa;
            padding: 44px 24px 40px;
            text-align: center;
            border-bottom: 1px solid #f0ece8;
        }
        .page-header h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #7c3aed 0%, #c9b1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }
        .page-header p {
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.35s forwards;
        }

        /* CONTAINER */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 44px 24px 80px;
        }

        /* INPUT BOX */
        .input-box {
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 36px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus-within {
            border-color: #c4a8f0;
            box-shadow: 0 0 0 4px rgba(124,58,237,0.07);
        }
        .input-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #2d2d2d;
            font-size: 17px;
            font-family: 'Lora', Georgia, serif;
            font-style: italic;
            resize: none;
            outline: none;
            min-height: 80px;
            line-height: 1.8;
        }
        .input-box textarea::placeholder { color: #ccc; }
        .input-box .author-input {
            width: 100%;
            background: transparent;
            border: none;
            border-top: 1px solid #f0ece8;
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Nunito', sans-serif;
            outline: none;
            padding-top: 12px;
            margin-top: 12px;
        }
        .input-box .author-input::placeholder { color: #ddd; }
        .input-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #f0ece8;
        }
        .submit-btn {
            background: linear-gradient(90deg, #7c3aed, #c9b1ff);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 9px 24px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .submit-btn:hover { opacity: 0.85; transform: translateY(-1px); }

        /* QUOTE CARDS */
        .quotes-grid { display: flex; flex-direction: column; gap: 16px; }

        .quote-card {
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 18px;
            padding: 28px;
            animation: fadeUp 0.4s ease forwards;
            transition: border-color 0.2s, transform 0.2s;
        }
        .quote-card:hover { border-color: #c4a8f0; transform: translateX(4px); }

        .quote-mark {
            font-size: 52px;
            color: #e8e0f8;
            line-height: 1;
            margin-bottom: 6px;
            font-family: Georgia, serif;
            font-weight: 700;
        }
        .quote-content {
            font-size: 17px;
            font-family: 'Lora', Georgia, serif;
            font-style: italic;
            color: #444;
            line-height: 1.8;
            margin-bottom: 18px;
        }
        .quote-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .quote-author {
            font-size: 12px;
            font-weight: 700;
            color: #bbb;
        }
        .quote-author span { color: #999; margin-right: 6px; }
        .quote-actions { display: flex; gap: 8px; align-items: center; }

        .share-btn {
            background: transparent;
            color: #bbb;
            border: 1.5px solid #e8e0f8;
            border-radius: 10px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .share-btn:hover { border-color: #c4a8f0; color: #7c3aed; }

        .del-btn {
            background: transparent;
            color: #ddd;
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
        }
        .del-btn:hover { color: #e05060; }

        /* COMMENT SECTION */
        .comment-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0ece8;
        }
        .comment-toggle {
            font-size: 13px;
            font-weight: 700;
            color: #bbb;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }
        .comment-toggle:hover { color: #7c3aed; }
        .comment-inner { display: none; margin-top: 16px; }
        .comment-inner.open { display: block; }
        .comment-card { padding: 12px 0; border-bottom: 1px solid #f4f0ec; }
        .comment-author { font-size: 12px; font-weight: 700; color: #bbb; margin-bottom: 4px; }
        .comment-author span { color: #888; }
        .comment-text { font-size: 14px; font-weight: 600; color: #666; }

        .comment-textarea {
            width: 100%;
            background: #fff;
            border: 2px solid #f0ece8;
            border-radius: 12px;
            padding: 10px 14px;
            color: #2d2d2d;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            resize: none;
            min-height: 60px;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
        }
        .comment-textarea:focus { border-color: #c4a8f0; }
        .comment-send-btn {
            background: linear-gradient(90deg, #7c3aed, #c9b1ff);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            margin-left: auto;
        }
        .comment-file-label {
            color: #bbb;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }
        .comment-rec-btn {
            background: transparent;
            border: 1.5px solid #e8e0f8;
            border-radius: 8px;
            padding: 5px 12px;
            color: #bbb;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s;
        }
        .comment-rec-btn:hover { border-color: #c4a8f0; color: #7c3aed; }

        .empty {
            text-align: center;
            color: #bbb;
            padding: 60px 0;
            font-size: 15px;
            font-weight: 600;
        }

        /* TOAST */
        .copied {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #7c3aed, #c9b1ff);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .copied.show { opacity: 1; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 36px 20px;
            border-top: 1px solid #f4f0ec;
            font-size: 13px;
            color: #bbb;
            font-weight: 600;
            margin-top: 20px;
        }
        .footer-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 10px; }
        .footer-dots span { width: 8px; height: 8px; border-radius: 50%; }

        @media (max-width: 600px) {
            nav { padding: 14px 16px; }
            .page-header { padding: 32px 16px 28px; }
            .page-header h1 { font-size: 26px; }
            .container { padding: 28px 16px 60px; }
            .quote-content { font-size: 15px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <svg width="28" height="28" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#c97d4e" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M100 148 C80 132,56 116,56 92 C56 75,69 64,82 64 C89 64,96 68,100 74 C104 68,111 64,118 64 C131 64,144 75,144 92 C144 116,120 132,100 148Z" stroke-width="1.4" opacity="0.9"/>
                    <path d="M100 138 C82 123,64 109,64 90 C64 76,75 67,86 67 C92 67,98 71,100 77 C102 71,108 67,114 67 C125 67,136 76,136 90 C136 109,118 123,100 138Z" stroke-width="1.2" opacity="0.65"/>
                </g>
            </svg>
            for heal
        </a>
        <a href="index.html" class="back">← Kembali</a>
    </nav>

    <div class="page-header">
        <h1>💬 Quote Highlight</h1>
        <p>Share quote yang relate atau bikin semangat.</p>
    </div>

    <div class="container">
        <div class="input-box" id="inputBox">
            <textarea id="quoteInput" placeholder="Tulis quote yang relate sama kamu..."></textarea>
            <input type="text" id="authorInput" class="author-input" placeholder="— Sumber / nama (opsional)" />
            <div class="input-footer">
                <button class="submit-btn" onclick="addQuote()">✨ Share Quote</button>
            </div>
        </div>

        <div class="quotes-grid" id="quotesList">
            <p class="empty">Belum ada quote.</p>
        </div>
    </div>

    <div class="copied" id="copiedToast">✓ Quote disalin!</div>

    <footer>
        <div class="footer-dots">
            <span style="background:#f7a8b8"></span>
            <span style="background:#f7b731"></span>
            <span style="background:#a8e6cf"></span>
            <span style="background:#a0c4ff"></span>
            <span style="background:#c9b1ff"></span>
        </div>
        <p>made with my hand — for heal</p>
    </footer>

    <script src="comments.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const currentUser = localStorage.getItem('username');
        if (!token) document.getElementById('inputBox').style.display = 'none';

        const recorders = {};
        const recBlobs = {};

        async function loadQuotes() {
            const res = await fetch('/api/quotes');
            const data = await res.json();
            const list = document.getElementById('quotesList');
            if (data.length === 0) {
                list.innerHTML = '<p class="empty">Belum ada quote.</p>';
                return;
            }
            list.innerHTML = data.map(q => `
                <div class="quote-card">
                    <div class="quote-mark">"</div>
                    <p class="quote-content">${q.content}</p>
                    <div class="quote-footer">
                        <div class="quote-author">
                            <span>✍️ ${q.username}</span>
                            ${q.author ? `· ${q.author}` : ''}
                        </div>
                        <div class="quote-actions">
                            <button class="share-btn" onclick="copyQuote('${q.content.replace(/'/g, "\\'")}', '${(q.author || '').replace(/'/g, "\\'")}')">📋 Salin</button>
                            ${(q.username === currentUser || currentUser === 'arekujo001') ? `<button class="del-btn" onclick="deleteQuote(${q.id})">🗑</button>` : ''}
                        </div>
                    </div>
                    <div class="comment-section">
                        <button class="comment-toggle" onclick="toggleComments(this, 'quote', ${q.id})">💬 Lihat komentar</button>
                        <div class="comment-inner" id="comments-quote-${q.id}"></div>
                    </div>
                </div>
            `).join('');
        }

        function toggleComments(btn, type, id) {
            const inner = document.getElementById(`comments-${type}-${id}`);
            if (inner.classList.contains('open')) {
                inner.classList.remove('open');
                btn.textContent = '💬 Lihat komentar';
            } else {
                inner.classList.add('open');
                btn.textContent = '💬 Tutup komentar';
                loadCommentsInto(type, id, inner);
            }
        }

        async function loadCommentsInto(type, id, container) {
            const res = await fetch(`/api/comments/${type}/${id}`);
            const comments = await res.json();
            container.innerHTML = `
                ${comments.length === 0 ? '<p style="color:#bbb; font-size:13px; font-weight:700; padding:10px 0;">Belum ada komentar.</p>' : ''}
                ${comments.map(c => `
                    <div class="comment-card">
                        <p class="comment-author"><span>${c.author}</span> · ${c.date}</p>
                        ${c.text ? `<p class="comment-text">${c.text}</p>` : ''}
                        ${c.image_url ? `<img src="${c.image_url}" style="width:100%; max-height:200px; object-fit:cover; border-radius:12px; margin-top:8px;" />` : ''}
                        ${c.audio_url ? `<audio controls src="${c.audio_url}" style="width:100%; margin-top:8px;"></audio>` : ''}
                    </div>
                `).join('')}
                ${token ? `
                    <div style="margin-top:16px;">
                        <textarea id="ct-${type}-${id}" class="comment-textarea" placeholder="Tulis komentar..."></textarea>
                        <div style="display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap;">
                            <label class="comment-file-label">📷 <input type="file" id="ci-${type}-${id}" accept="image/*" style="display:none;"> Foto</label>
                            <label class="comment-file-label">📁 <input type="file" id="ca-${type}-${id}" accept="audio/mp4,audio/m4a,audio/webm,audio/*" style="display:none;"> Voice</label>
                            <button onclick="recordInline('${type}', ${id})" id="rec-${type}-${id}" class="comment-rec-btn">🎙️ voice</button>
                            <audio id="ra-${type}-${id}" style="display:none; width:100%; margin-top:6px;" controls></audio>
                            <button onclick="postComment('${type}', ${id}, this)" class="comment-send-btn">Kirim</button>
                        </div>
                    </div>
                ` : '<p style="color:#bbb; font-size:13px; font-weight:700; margin-top:12px;"><a href="login.html" style="color:#7c3aed;">Masuk</a> untuk komentar.</p>'}
            `;
        }

        async function postComment(type, id, btn) {
            const key = `${type}-${id}`;
            const text = document.getElementById(`ct-${type}-${id}`)?.value.trim();
            const imageFile = document.getElementById(`ci-${type}-${id}`)?.files[0];
            const audioFile = document.getElementById(`ca-${type}-${id}`)?.files[0];
            const recorded = recBlobs[key];
            if (!text && !imageFile && !audioFile && !recorded) return;
            const formData = new FormData();
            if (text) formData.append('text', text);
            if (imageFile) formData.append('image', imageFile);
            if (audioFile) formData.append('audio', audioFile);
            if (recorded) formData.append('audio', recorded.blob, `voice.${recorded.ext}`);
            btn.textContent = '...';
            const res = await fetch(`/api/comments/${type}/${id}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            if (res.ok) {
                delete recBlobs[key];
                const container = document.getElementById(`comments-${type}-${id}`);
                loadCommentsInto(type, id, container);
            }
        }

        async function recordInline(type, id) {
            const btn = document.getElementById(`rec-${type}-${id}`);
            const key = `${type}-${id}`;
            if (!recorders[key] || recorders[key].state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' :
                                     MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
                    recorders[key] = new MediaRecorder(stream, { mimeType });
                    const chunks = [];
                    recorders[key].ondataavailable = e => chunks.push(e.data);
                    recorders[key].onstop = () => {
                        recBlobs[key] = { blob: new Blob(chunks, { type: mimeType }), ext: mimeType.includes('mp4') ? 'mp4' : mimeType.includes('webm') ? 'webm' : 'ogg' };
                        const audio = document.getElementById(`ra-${type}-${id}`);
                        audio.src = URL.createObjectURL(recBlobs[key].blob);
                        audio.style.display = 'block';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    recorders[key].start();
                    btn.textContent = '⏹️ Stop';
                    btn.style.color = '#e05060';
                    btn.style.borderColor = '#ffc0cc';
                } catch {
                    alert('Izin mikrofon ditolak!');
                }
            } else {
                recorders[key].stop();
                btn.textContent = '🎙️ voice';
                btn.style.color = '#bbb';
                btn.style.borderColor = '#e8e0f8';
            }
        }

        async function addQuote() {
            const content = document.getElementById('quoteInput').value.trim();
            const author = document.getElementById('authorInput').value.trim();
            if (!content) return;
            const res = await fetch('/api/quotes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ content, author })
            });
            if (res.ok) {
                document.getElementById('quoteInput').value = '';
                document.getElementById('authorInput').value = '';
                loadQuotes();
            }
        }

        async function deleteQuote(id) {
            if (!confirm('Hapus quote ini?')) return;
            await fetch(`/api/quotes/${id}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            loadQuotes();
        }

        function copyQuote(content, author) {
            const text = author ? `"${content}"\n— ${author}` : `"${content}"`;
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('copiedToast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        loadQuotes();
    </script>
    <script src="push-init.js"></script>
</body>
</html>
