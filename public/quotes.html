<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Quote Highlight</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; opacity: 0; animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #222; }
        nav .logo { font-size: 20px; font-weight: 600; color: #fff; text-decoration: none; }
        nav a { color: #aaa; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        nav a:hover { color: #fff; }
        .container { max-width: 720px; margin: 0 auto; padding: 60px 20px; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 32px; color: #fff; font-weight: 600; margin-bottom: 8px; }
        .header p { color: #555; font-size: 15px; }
        .input-box { background: #161616; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 40px; }
        .input-box textarea { width: 100%; background: transparent; border: none; color: #e0e0e0; font-size: 18px; font-family: 'Segoe UI', sans-serif; resize: none; outline: none; min-height: 80px; line-height: 1.7; font-style: italic; }
        .input-box textarea::placeholder { color: #333; font-style: italic; }
        .input-box input { width: 100%; background: transparent; border: none; border-top: 1px solid #1e1e1e; color: #666; font-size: 14px; font-family: 'Segoe UI', sans-serif; outline: none; padding-top: 12px; margin-top: 12px; }
        .input-box input::placeholder { color: #333; }
        .input-footer { display: flex; justify-content: flex-end; margin-top: 16px; padding-top: 12px; border-top: 1px solid #1e1e1e; }
        .submit-btn { background: #fff; color: #000; border: none; border-radius: 8px; padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .submit-btn:hover { opacity: 0.85; }
        .quotes-grid { display: flex; flex-direction: column; gap: 16px; }
        .quote-card { background: #161616; border: 1px solid #1e1e1e; border-radius: 12px; padding: 28px; animation: fadeUp 0.4s ease forwards; transition: border-color 0.2s; }
        .quote-card:hover { border-color: #333; }
        .quote-mark { font-size: 48px; color: #222; line-height: 1; margin-bottom: 8px; font-family: Georgia, serif; }
        .quote-content { font-size: 18px; color: #ccc; line-height: 1.7; font-style: italic; margin-bottom: 16px; }
        .quote-footer { display: flex; justify-content: space-between; align-items: center; }
        .quote-author { font-size: 13px; color: #555; }
        .quote-author span { color: #444; margin-right: 8px; }
        .quote-actions { display: flex; gap: 8px; }
        .share-btn { background: transparent; color: #555; border: 1px solid #222; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .share-btn:hover { border-color: #6bffb8; color: #6bffb8; }
        .del-btn { background: transparent; color: #333; border: none; font-size: 13px; cursor: pointer; transition: color 0.2s; }
        .del-btn:hover { color: #ff6b6b; }
        .empty { text-align: center; color: #333; padding: 60px 0; font-size: 15px; }
        .copied { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #6bffb8; color: #000; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .copied.show { opacity: 1; }
        .comment-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #1e1e1e; }
        .comment-toggle { font-size: 13px; color: #555; cursor: pointer; transition: color 0.2s; background: none; border: none; padding: 0; }
        .comment-toggle:hover { color: #aaa; }
        .comment-inner { display: none; margin-top: 16px; }
        .comment-inner.open { display: block; }
        .comment-card { padding: 12px 0; border-bottom: 1px solid #1a1a1a; }
        .comment-author { font-size: 13px; color: #666; margin-bottom: 4px; }
        .comment-author span { color: #aaa; font-weight: 500; }
        .comment-text { font-size: 14px; color: #888; }
        footer { text-align: center; padding: 40px; border-top: 1px solid #1e1e1e; color: #444; font-size: 13px; margin-top: 60px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">for heal</a>
        <a href="index.html">← Kembali</a>
    </nav>

    <div class="container">
        <div class="header">
            <h1>💬 Quote Highlight</h1>
            <p>Share quote yang relate atau bikin semangat.</p>
        </div>

        <div class="input-box" id="inputBox">
            <textarea id="quoteInput" placeholder="Tulis quote yang relate sama kamu..."></textarea>
            <input type="text" id="authorInput" placeholder="— Sumber / nama (opsional)" />
            <div class="input-footer">
                <button class="submit-btn" onclick="addQuote()">Share Quote</button>
            </div>
        </div>

        <div class="quotes-grid" id="quotesList">
            <p class="empty">Belum ada quote.</p>
        </div>
    </div>

    <div class="copied" id="copiedToast">✓ Quote disalin!</div>
    <footer><p>made with my hand</p></footer>

    <script src="comments.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const currentUser = localStorage.getItem('username');
        if (!token) document.getElementById('inputBox').style.display = 'none';

        const recorders = {};
        const recBlobs = {};

        async function loadQuotes() {
            const res = await fetch('/api/quotes');
            const data = await res.json();
            const list = document.getElementById('quotesList');
            if (data.length === 0) {
                list.innerHTML = '<p class="empty">Belum ada quote.</p>';
                return;
            }
            list.innerHTML = data.map(q => `
                <div class="quote-card">
                    <div class="quote-mark">"</div>
                    <p class="quote-content">${q.content}</p>
                    <div class="quote-footer">
                        <div class="quote-author">
                            <span>✍️ ${q.username}</span>
                            ${q.author ? `· ${q.author}` : ''}
                        </div>
                        <div class="quote-actions">
                            <button class="share-btn" onclick="copyQuote('${q.content.replace(/'/g, "\\'")}', '${(q.author || '').replace(/'/g, "\\'")}')">📋 Salin</button>
                            ${(q.username === currentUser || currentUser === 'arekujo001') ? `<button class="del-btn" onclick="deleteQuote(${q.id})">🗑</button>` : ''}
                        </div>
                    </div>
                    <div class="comment-section">
                        <button class="comment-toggle" onclick="toggleComments(this, 'quote', ${q.id})">💬 Lihat komentar</button>
                        <div class="comment-inner" id="comments-quote-${q.id}"></div>
                    </div>
                </div>
            `).join('');
        }

        function toggleComments(btn, type, id) {
            const inner = document.getElementById(`comments-${type}-${id}`);
            if (inner.classList.contains('open')) {
                inner.classList.remove('open');
                btn.textContent = '💬 Lihat komentar';
            } else {
                inner.classList.add('open');
                btn.textContent = '💬 Tutup komentar';
                loadCommentsInto(type, id, inner);
            }
        }

        async function loadCommentsInto(type, id, container) {
            const res = await fetch(`/api/comments/${type}/${id}`);
            const comments = await res.json();
            container.innerHTML = `
                ${comments.length === 0 ? '<p style="color:#444; font-size:13px; padding:10px 0;">Belum ada komentar.</p>' : ''}
                ${comments.map(c => `
                    <div class="comment-card">
                        <p class="comment-author"><span>${c.author}</span> · ${c.date}</p>
                        ${c.text ? `<p class="comment-text">${c.text}</p>` : ''}
                        ${c.image_url ? `<img src="${c.image_url}" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-top:8px;" />` : ''}
                        ${c.audio_url ? `<audio controls src="${c.audio_url}" style="width:100%; margin-top:8px;"></audio>` : ''}
                    </div>
                `).join('')}
                ${token ? `
                    <div style="margin-top:16px;">
                        <textarea id="ct-${type}-${id}" placeholder="Tulis komentar..." style="width:100%; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; padding:10px; color:#fff; font-size:14px; outline:none; resize:none; min-height:60px; font-family:'Segoe UI',sans-serif;"></textarea>
                        <div style="display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap;">
                            <label style="color:#555; font-size:12px; cursor:pointer;">📷 <input type="file" id="ci-${type}-${id}" accept="image/*" style="display:none;"> Foto</label>
                            <label style="color:#555; font-size:12px; cursor:pointer;">📁 <input type="file" id="ca-${type}-${id}" accept="audio/mp4,audio/m4a,audio/webm,audio/*" style="display:none;"> Voice</label>
                            <button onclick="recordInline('${type}', ${id})" id="rec-${type}-${id}" style="background:transparent; border:1px solid #333; border-radius:6px; padding:5px 12px; color:#aaa; font-size:12px; cursor:pointer;">🎙️ Rekam</button>
                            <audio id="ra-${type}-${id}" style="display:none; width:100%; margin-top:6px;" controls></audio>
                            <button onclick="postComment('${type}', ${id}, this)" style="background:#fff; color:#000; border:none; border-radius:6px; padding:6px 16px; font-size:13px; font-weight:600; cursor:pointer; margin-left:auto;">Kirim</button>
                        </div>
                    </div>
                ` : '<p style="color:#555; font-size:13px; margin-top:12px;"><a href="login.html" style="color:#aaa;">Masuk</a> untuk komentar.</p>'}
            `;
        }

        async function postComment(type, id, btn) {
            const key = `${type}-${id}`;
            const text = document.getElementById(`ct-${type}-${id}`)?.value.trim();
            const imageFile = document.getElementById(`ci-${type}-${id}`)?.files[0];
            const audioFile = document.getElementById(`ca-${type}-${id}`)?.files[0];
            const recorded = recBlobs[key];
            if (!text && !imageFile && !audioFile && !recorded) return;
            const formData = new FormData();
            if (text) formData.append('text', text);
            if (imageFile) formData.append('image', imageFile);
            if (audioFile) formData.append('audio', audioFile);
            if (recorded) formData.append('audio', recorded.blob, `voice.${recorded.ext}`);
            btn.textContent = '...';
            const res = await fetch(`/api/comments/${type}/${id}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            if (res.ok) {
                delete recBlobs[key];
                const container = document.getElementById(`comments-${type}-${id}`);
                loadCommentsInto(type, id, container);
            }
        }

        async function recordInline(type, id) {
            const btn = document.getElementById(`rec-${type}-${id}`);
            const key = `${type}-${id}`;
            if (!recorders[key] || recorders[key].state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' :
                                     MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
                    recorders[key] = new MediaRecorder(stream, { mimeType });
                    const chunks = [];
                    recorders[key].ondataavailable = e => chunks.push(e.data);
                    recorders[key].onstop = () => {
                        recBlobs[key] = { blob: new Blob(chunks, { type: mimeType }), ext: mimeType.includes('mp4') ? 'mp4' : mimeType.includes('webm') ? 'webm' : 'ogg' };
                        const audio = document.getElementById(`ra-${type}-${id}`);
                        audio.src = URL.createObjectURL(recBlobs[key].blob);
                        audio.style.display = 'block';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    recorders[key].start();
                    btn.textContent = '⏹️ Stop';
                    btn.style.color = '#ff6b6b';
                    btn.style.borderColor = '#ff6b6b';
                } catch {
                    alert('Izin mikrofon ditolak!');
                }
            } else {
                recorders[key].stop();
                btn.textContent = '🎙️ Rekam';
                btn.style.color = '#aaa';
                btn.style.borderColor = '#333';
            }
        }

        async function addQuote() {
            const content = document.getElementById('quoteInput').value.trim();
            const author = document.getElementById('authorInput').value.trim();
            if (!content) return;
            const res = await fetch('/api/quotes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ content, author })
            });
            if (res.ok) {
                document.getElementById('quoteInput').value = '';
                document.getElementById('authorInput').value = '';
                loadQuotes();
            }
        }

        async function deleteQuote(id) {
            if (!confirm('Hapus quote ini?')) return;
            await fetch(`/api/quotes/${id}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            loadQuotes();
        }

        function copyQuote(content, author) {
            const text = author ? `"${content}"\n— ${author}` : `"${content}"`;
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('copiedToast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        loadQuotes();
    </script>
    <script src="push-init.js"></script>
</body>
</html>
