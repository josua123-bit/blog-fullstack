<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>all about us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; opacity: 0; animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; border-bottom: 1px solid #222; }
        nav .logo { font-size: 20px; font-weight: 600; color: #fff; text-decoration: none; }
        nav a { color: #aaa; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        nav a:hover { color: #fff; }
        .container { max-width: 720px; margin: 0 auto; padding: 60px 20px; }
        .cover-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 40px; }
        .tag { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        h1 { font-size: 36px; color: #fff; font-weight: 600; line-height: 1.3; margin-bottom: 16px; }
        .meta { display: flex; gap: 16px; font-size: 13px; color: #444; margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid #1e1e1e; align-items: center; flex-wrap: wrap; }
        .content { font-size: 17px; color: #bbb; line-height: 1.9; white-space: pre-wrap; }
        .delete-btn { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all 0.2s; margin-left: auto; }
        .delete-btn:hover { background: #ff6b6b; color: #000; }
        .like-section { display: flex; align-items: center; gap: 12px; margin: 30px 0; padding: 20px 0; border-top: 1px solid #1e1e1e; border-bottom: 1px solid #1e1e1e; }
        .like-btn { background: transparent; border: 1px solid #333; border-radius: 50px; padding: 10px 20px; color: #aaa; font-size: 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .like-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .like-btn.liked { background: #ff6b6b22; border-color: #ff6b6b; color: #ff6b6b; }
        .like-count { font-size: 14px; color: #555; }
        .comments { margin-top: 20px; }
        .comments h2 { font-size: 18px; color: #fff; margin-bottom: 24px; }
        .comment-card { padding: 20px 0; border-bottom: 1px solid #1a1a1a; }
        .comment-author { font-size: 13px; color: #666; margin-bottom: 6px; }
        .comment-author span { color: #aaa; font-weight: 500; }
        .comment-text { font-size: 15px; color: #888; }
        .comment-form { margin-top: 30px; }
        .comment-form textarea { width: 100%; background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; resize: vertical; min-height: 100px; font-family: 'Segoe UI', sans-serif; transition: border 0.2s; }
        .comment-form textarea:focus { border-color: #555; }
        .comment-btn { background: #fff; color: #000; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; transition: opacity 0.2s; }
        .comment-btn:hover { opacity: 0.85; }
        .login-prompt { font-size: 14px; color: #555; margin-top: 20px; }
        .login-prompt a { color: #aaa; text-decoration: none; }
        .login-prompt a:hover { color: #fff; }
        .empty-comment { color: #444; font-size: 14px; padding: 20px 0; }
        .success { color: #6bffb8; font-size: 13px; margin-top: 8px; display: none; }
        .error { color: #ff6b6b; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">for heal</a>
        <a href="index.html">← Kembali</a>
    </nav>

    <div class="container">
        <div id="articleContent">
            <p style="color:#444;">Memuat artikel...</p>
        </div>

        <div class="like-section">
            <button class="like-btn" id="likeBtn" onclick="toggleLike()">❤️ <span id="likeBtnText">Suka</span></button>
            <span class="like-count" id="likeCount">0 suka</span>
        </div>

        <div class="comments">
            <h2>Komentar (<span id="commentCount">0</span>)</h2>
            <div id="commentList"><p class="empty-comment">Belum ada komentar. Jadilah yang pertama!</p></div>

            <div class="comment-form" id="commentForm">
                <textarea id="commentText" placeholder="Tulis komentarmu..."></textarea>
                <label style="margin-top:12px; display:block; font-size:13px; color:#777;">Foto (opsional)</label>
                <input type="file" id="commentImage" accept="image/*" onchange="previewComment()" style="width:100%; background:#161616; border:1px solid #2a2a2a; border-radius:8px; padding:10px 14px; color:#aaa; font-size:14px; outline:none; cursor:pointer; margin-top:6px;" />
                <img id="commentPreview" style="display:none; width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-top:10px;" />
                <div style="display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;">
                    <button onclick="recordArticleComment()" id="recordArticleBtn" style="background:transparent; border:1px solid #333; border-radius:6px; padding:6px 14px; color:#aaa; font-size:13px; cursor:pointer;">🎙️ voice</button>
                    <audio id="articleAudioPreview" style="display:none; width:100%; margin-top:6px;" controls></audio>
                </div>
                <p class="error" id="errorMsg"></p>
                <p class="success" id="successMsg"></p>
                <button class="comment-btn" onclick="submitComment()">Kirim Komentar</button>
            </div>
            <p class="login-prompt" id="loginPrompt" style="display:none;">
                <a href="login.html">Masuk</a> untuk meninggalkan komentar.
            </p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const currentUser = localStorage.getItem('username');
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');

        if (!token) {
            document.getElementById('commentForm').style.display = 'none';
            document.getElementById('loginPrompt').style.display = 'block';
        }

        async function loadArticle() {
            if (!articleId) { location.href = 'index.html'; return; }
            try {
                const res = await fetch(`/api/articles/${articleId}`);
                if (!res.ok) { location.href = 'index.html'; return; }
                const a = await res.json();
                document.title = a.title;
                const deleteBtn = currentUser
                    ? `<button class="delete-btn" onclick="deleteArticle()">🗑 Hapus</button>`
                    : '';
                document.getElementById('articleContent').innerHTML = `
                    ${a.image_url ? `<img src="${a.image_url}" class="cover-img" />` : ''}
                    <p class="tag">${a.tag}</p>
                    <h1>${a.title}</h1>
                    <div class="meta">
                        <span>✍️ ${a.author}</span>
                        <span>📅 ${a.date}</span>
                        ${deleteBtn}
                    </div>
                    <div class="content">${a.content}</div>
                `;
                renderComments(a.comments);
                loadLikes();
            } catch {
                location.href = 'index.html';
            }
        }

        async function loadLikes() {
            const res = await fetch(`/api/articles/${articleId}/likes`, {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            const data = await res.json();
            document.getElementById('likeCount').textContent = `${data.count} suka`;
            const btn = document.getElementById('likeBtn');
            if (data.liked) {
                btn.classList.add('liked');
                document.getElementById('likeBtnText').textContent = 'Disukai';
            }
        }

        async function toggleLike() {
            if (!token) { location.href = 'login.html'; return; }
            const res = await fetch(`/api/articles/${articleId}/like`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            document.getElementById('likeCount').textContent = `${data.count} suka`;
            const btn = document.getElementById('likeBtn');
            if (data.liked) {
                btn.classList.add('liked');
                document.getElementById('likeBtnText').textContent = 'Disukai';
            } else {
                btn.classList.remove('liked');
                document.getElementById('likeBtnText').textContent = 'Suka';
            }
        }

        function renderComments(comments) {
            document.getElementById('commentCount').textContent = comments.length;
            const list = document.getElementById('commentList');
            if (comments.length === 0) {
                list.innerHTML = '<p class="empty-comment">Belum ada komentar. Jadilah yang pertama!</p>';
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="comment-card">
                    <p class="comment-author"><span>${c.author}</span> · ${c.date}</p>
                    ${c.text ? `<p class="comment-text">${c.text}</p>` : ''}
                    ${c.image_url ? `<img src="${c.image_url}" style="width:100%; max-height:300px; object-fit:cover; border-radius:8px; margin-top:10px;" />` : ''}
                    ${c.audio_url ? `<audio controls src="${c.audio_url}" style="width:100%; margin-top:10px;"></audio>` : ''}
                </div>
            `).join('');
        }

        async function submitComment() {
            const text = document.getElementById('commentText').value.trim();
            const imageFile = document.getElementById('commentImage').files[0];
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            if (!text && !imageFile && !articleAudioBlob) {
                errorMsg.textContent = 'Komentar tidak boleh kosong!';
                errorMsg.style.display = 'block';
                return;
            }
            try {
                const formData = new FormData();
                if (text) formData.append('text', text);
                if (imageFile) formData.append('image', imageFile);
                if (articleAudioBlob) {
                    const ext = articleMimeType.includes('mp4') ? 'mp4' : articleMimeType.includes('webm') ? 'webm' : 'ogg';
                    formData.append('audio', articleAudioBlob, `voice.${ext}`);
                }
                const res = await fetch(`/api/comments/article/${articleId}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    return;
                }
                successMsg.textContent = 'Komentar berhasil dikirim!';
                successMsg.style.display = 'block';
                document.getElementById('commentText').value = '';
                document.getElementById('commentImage').value = '';
                document.getElementById('commentPreview').style.display = 'none';
                articleAudioBlob = null;
                document.getElementById('articleAudioPreview').style.display = 'none';
                document.getElementById('articleAudioPreview').src = '';
                renderComments(data.comments);
            } catch {
                errorMsg.textContent = 'Gagal terhubung ke server.';
                errorMsg.style.display = 'block';
            }
        }

        function previewComment() {
            const file = document.getElementById('commentImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const preview = document.getElementById('commentPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function deleteArticle() {
            if (!confirm('Yakin mau hapus artikel ini?')) return;
            try {
                const res = await fetch(`/api/articles/${articleId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    alert('Artikel berhasil dihapus!');
                    location.href = 'index.html';
                }
            } catch {
                alert('Gagal menghapus artikel.');
            }
        }

        let articleAudioBlob = null;
        let articleRecorder = null;
        let articleMimeType = '';

        async function recordArticleComment() {
            const btn = document.getElementById('recordArticleBtn');
            if (!articleRecorder || articleRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    articleMimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
                                   : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
                    articleRecorder = new MediaRecorder(stream, { mimeType: articleMimeType });
                    const chunks = [];
                    articleRecorder.ondataavailable = e => chunks.push(e.data);
                    articleRecorder.onstop = () => {
                        articleAudioBlob = new Blob(chunks, { type: articleMimeType });
                        const preview = document.getElementById('articleAudioPreview');
                        preview.src = URL.createObjectURL(articleAudioBlob);
                        preview.style.display = 'block';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    articleRecorder.start();
                    btn.textContent = '⏹️ Stop';
                    btn.style.color = '#ff6b6b';
                    btn.style.borderColor = '#ff6b6b';
                } catch {
                    alert('Izin mikrofon ditolak!');
                }
            } else {
                articleRecorder.stop();
                btn.textContent = '🎙️ voice';
                btn.style.color = '#aaa';
                btn.style.borderColor = '#333';
            }
        }

        loadArticle();
    </script>
    <script src="push-init.js"></script>
</body>
</html>
