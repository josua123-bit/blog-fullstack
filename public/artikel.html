<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>all about us</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background:
                radial-gradient(ellipse 55% 45% at 8%  12%, #fff3e0 0%, transparent 70%),
                radial-gradient(ellipse 45% 40% at 92% 10%, #e8f5e9 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 50% 90%, #e8eaf6 0%, transparent 70%),
                radial-gradient(ellipse 40% 35% at 90% 88%, #fce4ec 0%, transparent 70%),
                #fafafa;
            color: #2d2d2d;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0.92); }
            60%  { transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        @keyframes commentSlideIn {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* PAGE TRANSITION */
        .page-transition {
            position: fixed;
            inset: 0;
            background: #fafafa;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .page-transition.active { opacity: 1; pointer-events: all; }

        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f0ece8;
            position: sticky;
            top: 0;
            z-index: 10;
            animation: slideInDown 0.4s ease both;
        }
        nav .logo {
            font-size: 19px;
            font-weight: 800;
            color: #2d2d2d;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: opacity 0.2s;
        }
        nav .logo:hover { opacity: 0.7; }
        nav .back-link {
            font-size: 14px;
            font-weight: 700;
            color: #bbb;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        nav .back-link:hover { color: #b388ff; transform: translateX(-3px); }

        /* CONTAINER */
        .container { max-width: 720px; margin: 0 auto; padding: 60px 20px 80px; }

        /* SKELETON */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .cover-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            opacity: 0;
            animation: popIn 0.6s ease 0.1s forwards;
            transition: transform 0.3s ease;
        }
        .cover-img:hover { transform: scale(1.01); }

        .tag {
            font-size: 11px;
            font-weight: 800;
            color: #b388ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            display: inline-block;
            background: #f3eeff;
            padding: 4px 12px;
            border-radius: 20px;
            opacity: 0;
            animation: fadeUp 0.5s ease 0.2s forwards;
        }

        h1 {
            font-size: 34px;
            font-weight: 900;
            color: #1a1a1a;
            line-height: 1.3;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        .meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 600;
            color: #bbb;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 2px solid #f0ece8;
            align-items: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.4s forwards;
        }

        .content {
            font-size: 17px;
            color: #555;
            line-height: 1.9;
            white-space: pre-wrap;
            font-weight: 500;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.5s forwards;
        }

        .delete-btn {
            background: transparent;
            color: #e05060;
            border: 1.5px solid #ffc0cc;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: auto;
            font-family: 'Nunito', sans-serif;
        }
        .delete-btn:hover { background: #fff0f2; transform: scale(1.04); }

        /* LIKE */
        .like-section {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 36px 0;
            padding: 24px 0;
            border-top: 2px solid #f0ece8;
            border-bottom: 2px solid #f0ece8;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.6s forwards;
        }
        .like-btn {
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 30px;
            padding: 10px 22px;
            color: #aaa;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Nunito', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .like-btn:hover { border-color: #ffb3c1; color: #e05060; background: #fff0f2; transform: translateY(-2px); }
        .like-btn:active { transform: scale(0.95); }
        .like-btn.liked { background: #fff0f2; border-color: #ffb3c1; color: #e05060; }
        .like-btn.liked .heart { animation: heartBeat 0.4s ease; }
        @keyframes heartBeat {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.4); }
            60%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .like-count { font-size: 13px; font-weight: 700; color: #ccc; transition: all 0.3s; }

        /* COMMENTS */
        .comments {
            margin-top: 24px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.7s forwards;
        }
        .comments h2 {
            font-size: 20px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .comment-card {
            padding: 20px 0;
            border-bottom: 2px solid #f7f4f0;
            animation: commentSlideIn 0.4s ease both;
        }
        .comment-author {
            font-size: 12px;
            font-weight: 800;
            color: #ccc;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }
        .comment-text {
            font-size: 15px;
            font-weight: 600;
            color: #666;
            line-height: 1.7;
        }

        /* COMMENT FORM */
        .comment-form { margin-top: 32px; }

        .comment-form textarea {
            width: 100%;
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 16px;
            padding: 14px 16px;
            color: #2d2d2d;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            resize: vertical;
            min-height: 100px;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .comment-form textarea:focus {
            border-color: #c9b1ff;
            box-shadow: 0 0 0 4px rgba(201,177,255,0.12);
            background: #fff;
            transform: translateY(-1px);
        }
        .comment-form textarea::placeholder { color: #ccc; font-weight: 500; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
            margin-top: 18px;
        }

        .file-input {
            width: 100%;
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 14px;
            padding: 11px 16px;
            color: #aaa;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s;
        }
        .file-input:hover { border-color: #c9b1ff; }

        .voice-btn {
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 20px;
            padding: 8px 18px;
            color: #aaa;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .voice-btn:hover { border-color: #c9b1ff; color: #b388ff; transform: translateY(-1px); }

        .comment-btn {
            background: linear-gradient(90deg, #b388ff, #c9b1ff);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 16px;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
            font-family: 'Nunito', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .comment-btn:hover { opacity: 0.88; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(179,136,255,0.3); }
        .comment-btn:active { transform: scale(0.97); }

        .login-prompt {
            font-size: 14px;
            font-weight: 600;
            color: #bbb;
            margin-top: 20px;
        }
        .login-prompt a { color: #b388ff; text-decoration: none; font-weight: 800; }
        .login-prompt a:hover { text-decoration: underline; }

        .empty-comment { color: #ccc; font-size: 14px; font-weight: 600; padding: 20px 0; }

        .success {
            color: #2d9e6b;
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            display: none;
            background: #f0fdf4;
            border: 1.5px solid #90ddb8;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            animation: fadeUp 0.3s ease;
        }
        .error {
            color: #e05060;
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
            display: none;
            background: #fff0f2;
            border: 1.5px solid #ffc0cc;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            animation: fadeUp 0.3s ease;
        }

        /* RIPPLE */
        .ripple-el {
            position: absolute;
            border-radius: 50%;
            background: rgba(179,136,255,0.2);
            width: 60px; height: 60px;
            margin-top: -30px; margin-left: -30px;
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            nav { padding: 14px 16px; backdrop-filter: none; background: rgba(255,255,255,0.98); }
            h1 { font-size: 26px; }
            .container { padding: 40px 16px 60px; }
        }
    </style>
    </head>
<body>


<script>
if (sessionStorage.getItem('pinVerified') !== 'true') {
    location.href = '/index.html';
}
</script>

    <div class="page-transition" id="pageTransition"></div>

    <nav>
        <a href="index.html" class="logo" onclick="navigateTo(event, 'index.html')">
            <svg width="28" height="28" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#c97d4e" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M100 148 C80 132,56 116,56 92 C56 75,69 64,82 64 C89 64,96 68,100 74 C104 68,111 64,118 64 C131 64,144 75,144 92 C144 116,120 132,100 148Z" stroke-width="1.4" opacity="0.9"/>
                    <path d="M100 138 C82 123,64 109,64 90 C64 76,75 67,86 67 C92 67,98 71,100 77 C102 71,108 67,114 67 C125 67,136 76,136 90 C136 109,118 123,100 138Z" stroke-width="1.2" opacity="0.65"/>
                </g>
            </svg>
            for heal
        </a>
        <a href="index.html" class="back-link" onclick="navigateTo(event, 'index.html')">← Kembali</a>
    </nav>

    <div class="container">
        <div id="articleContent"></div>

        <div class="like-section">
            <button class="like-btn" id="likeBtn" onclick="toggleLike()">
                <span class="heart">❤️</span>
                <span id="likeBtnText">Suka</span>
            </button>
            <span class="like-count" id="likeCount">0 suka</span>
        </div>

        <div class="comments">
            <h2>Komentar (<span id="commentCount">0</span>)</h2>
            <div id="commentList"><p class="empty-comment">Belum ada komentar. Jadilah yang pertama!</p></div>

            <div class="comment-form" id="commentForm">
                <textarea id="commentText" placeholder="Tulis komentarmu..."></textarea>

                <label class="form-label">Foto (opsional)</label>
                <input type="file" id="commentImage" accept="image/*" onchange="previewComment()" class="file-input" />
                <img id="commentPreview" style="display:none; width:100%; max-height:200px; object-fit:cover; border-radius:14px; margin-top:10px;" />

                <div style="display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap;">
                    <button onclick="recordArticleComment()" id="recordArticleBtn" class="voice-btn">🎙️ voice</button>
                    <audio id="articleAudioPreview" style="display:none; width:100%; margin-top:6px;" controls></audio>
                </div>

                <p class="error" id="errorMsg"></p>
                <p class="success" id="successMsg"></p>
                <button class="comment-btn" onclick="submitComment()">Kirim Komentar →</button>
            </div>

            <p class="login-prompt" id="loginPrompt" style="display:none;">
                <a href="login.html">Masuk</a> untuk meninggalkan komentar.
            </p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const currentUser = localStorage.getItem('username');
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');

        window.addEventListener('pageshow', () => {
            document.getElementById('pageTransition').classList.remove('active');
        });

        function navigateTo(e, url) {
            e.preventDefault();
            const overlay = document.getElementById('pageTransition');
            overlay.classList.add('active');
            setTimeout(() => { location.href = url; }, 280);
        }

        if (!token) {
            document.getElementById('commentForm').style.display = 'none';
            document.getElementById('loginPrompt').style.display = 'block';
        }

        async function loadArticle() {
            if (!articleId) { location.href = 'index.html'; return; }
            try {
                // skeleton
                document.getElementById('articleContent').innerHTML = `
                    <div class="skeleton" style="width:100%;height:280px;border-radius:20px;margin-bottom:40px;"></div>
                    <div class="skeleton" style="width:80px;height:22px;margin-bottom:14px;"></div>
                    <div class="skeleton" style="width:70%;height:36px;margin-bottom:12px;"></div>
                    <div class="skeleton" style="width:40%;height:16px;margin-bottom:40px;"></div>
                    <div class="skeleton" style="width:100%;height:14px;margin-bottom:8px;"></div>
                    <div class="skeleton" style="width:90%;height:14px;margin-bottom:8px;"></div>
                    <div class="skeleton" style="width:95%;height:14px;margin-bottom:8px;"></div>
                `;

                const res = await fetch(`/api/articles/${articleId}`);
                if (!res.ok) { location.href = 'index.html'; return; }
                const a = await res.json();
                document.title = a.title;
                const deleteBtn = currentUser
                    ? `<button class="delete-btn" onclick="deleteArticle()">🗑 Hapus</button>`
                    : '';
                document.getElementById('articleContent').innerHTML = `
                    ${a.image_url ? `<img src="${a.image_url}" class="cover-img" />` : ''}
                    <p class="tag">${a.tag}</p>
                    <h1>${a.title}</h1>
                    <div class="meta">
                      <a href="profile.html?u=${a.author}" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#bbb;">
                        ${a.avatar_url
                            ? `<img src="${a.avatar_url}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">`
                            : `<span style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f4845f,#f7b731);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;">${a.author.charAt(0).toUpperCase()}</span>`
                        }
                        <span style="font-size:14px;font-weight:700;">${a.author}</span>
                      </a>
                      <span>📅 ${a.date}</span>
                      ${deleteBtn}
                    </div>
                    <div class="content">${a.content}</div>
                `;
                renderComments(a.comments);
                loadLikes();
            } catch {
                location.href = 'index.html';
            }
        }

        async function loadLikes() {
            const res = await fetch(`/api/articles/${articleId}/likes`, {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            const data = await res.json();
            updateLikeUI(data);
        }

        function updateLikeUI(data) {
            document.getElementById('likeCount').textContent = `${data.count} suka`;
            const btn = document.getElementById('likeBtn');
            if (data.liked) {
                btn.classList.add('liked');
                document.getElementById('likeBtnText').textContent = 'Disukai';
            } else {
                btn.classList.remove('liked');
                document.getElementById('likeBtnText').textContent = 'Suka';
            }
        }

        async function toggleLike() {
            if (!token) { location.href = 'login.html'; return; }
            const btn = document.getElementById('likeBtn');
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => btn.style.transform = '', 150);

            const res = await fetch(`/api/articles/${articleId}/like`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            updateLikeUI(data);
        }

        function renderComments(comments) {
            document.getElementById('commentCount').textContent = comments.length;
            const list = document.getElementById('commentList');
            if (comments.length === 0) {
                list.innerHTML = '<p class="empty-comment">Belum ada komentar. Jadilah yang pertama!</p>';
                return;
            }
            list.innerHTML = comments.map((c, i) => {
                const canDelete = currentUser && (c.author === currentUser || currentUser === 'arekujo001');
                return `
                <div class="comment-card" style="animation-delay:${i * 0.06}s" id="comment-${c.id}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <p class="comment-author" style="display:flex;align-items:center;gap:8px;">
                            <a href="profile.html?u=${c.author}" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#b388ff;font-weight:800;">
                                ${c.avatar_url
                                    ? `<img src="${c.avatar_url}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;">`
                                    : `<span style="width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f4845f,#f7b731);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;">${c.author.charAt(0).toUpperCase()}</span>`
                                }
                                ${c.author}
                            </a>
                            · ${c.date}
                        </p>
                        ${canDelete ? `<button onclick="deleteComment(${c.id})" style="background:transparent;border:none;color:#ddd;font-size:13px;cursor:pointer;padding:2px 6px;border-radius:20px;transition:all 0.2s;" onmouseover="this.style.color='#e05060'" onmouseout="this.style.color='#ddd'">🗑</button>` : ''}
                    </div>
                    ${c.text ? `<p class="comment-text">${c.text}</p>` : ''}
                    ${c.image_url ? `<img src="${c.image_url}" style="width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:10px;" />` : ''}
                    ${c.audio_url ? `<audio controls src="${c.audio_url}" style="width:100%;margin-top:10px;"></audio>` : ''}
                </div>`;
            }).join('');
        }

        async function submitComment() {
            const text = document.getElementById('commentText').value.trim();
            const imageFile = document.getElementById('commentImage').files[0];
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            if (!text && !imageFile && !articleAudioBlob) {
                errorMsg.textContent = 'Komentar tidak boleh kosong!';
                errorMsg.style.display = 'block';
                return;
            }
            const btn = document.querySelector('.comment-btn');
            btn.textContent = 'Mengirim...';
            btn.style.opacity = '0.7';
            try {
                const formData = new FormData();
                if (text) formData.append('text', text);
                if (imageFile) formData.append('image', imageFile);
                if (articleAudioBlob) {
                    const ext = articleMimeType.includes('mp4') ? 'mp4' : articleMimeType.includes('webm') ? 'webm' : 'ogg';
                    formData.append('audio', articleAudioBlob, `voice.${ext}`);
                }
                const res = await fetch(`/api/comments/article/${articleId}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                btn.textContent = 'Kirim Komentar →';
                btn.style.opacity = '1';
                if (!res.ok) {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    return;
                }
                successMsg.textContent = '✅ Komentar berhasil dikirim!';
                successMsg.style.display = 'block';
                document.getElementById('commentText').value = '';
                document.getElementById('commentImage').value = '';
                document.getElementById('commentPreview').style.display = 'none';
                articleAudioBlob = null;
                document.getElementById('articleAudioPreview').style.display = 'none';
                document.getElementById('articleAudioPreview').src = '';
                renderComments(data.comments);
                setTimeout(() => successMsg.style.display = 'none', 3000);
            } catch {
                btn.textContent = 'Kirim Komentar →';
                btn.style.opacity = '1';
                errorMsg.textContent = 'Gagal terhubung ke server.';
                errorMsg.style.display = 'block';
            }
        }

        function previewComment() {
            const file = document.getElementById('commentImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const preview = document.getElementById('commentPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    preview.style.animation = 'popIn 0.4s ease';
                };
                reader.readAsDataURL(file);
            }
        }

        async function deleteArticle() {
            if (!confirm('Yakin mau hapus artikel ini?')) return;
            try {
                const res = await fetch(`/api/articles/${articleId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const overlay = document.getElementById('pageTransition');
                    overlay.classList.add('active');
                    setTimeout(() => location.href = 'index.html', 280);
                }
            } catch {
                alert('Gagal menghapus artikel.');
            }
        }

        let articleAudioBlob = null;
        let articleRecorder = null;
        let articleMimeType = '';

        async function recordArticleComment() {
            const btn = document.getElementById('recordArticleBtn');
            if (!articleRecorder || articleRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    articleMimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
                                   : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
                    articleRecorder = new MediaRecorder(stream, { mimeType: articleMimeType });
                    const chunks = [];
                    articleRecorder.ondataavailable = e => chunks.push(e.data);
                    articleRecorder.onstop = () => {
                        articleAudioBlob = new Blob(chunks, { type: articleMimeType });
                        const preview = document.getElementById('articleAudioPreview');
                        preview.src = URL.createObjectURL(articleAudioBlob);
                        preview.style.display = 'block';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    articleRecorder.start();
                    btn.textContent = '⏹️ Stop';
                    btn.style.borderColor = '#ffb3c1';
                    btn.style.color = '#e05060';
                } catch {
                    alert('Izin mikrofon ditolak!');
                }
            } else {
                articleRecorder.stop();
                btn.textContent = '🎙️ voice';
                btn.style.borderColor = '#f0ece8';
                btn.style.color = '#aaa';
            }
        }

        async function deleteComment(commentId) {
            if (!confirm('Hapus komentar ini?')) return;
            try {
                const el = document.getElementById(`comment-${commentId}`);
                if (el) { el.style.opacity = '0'; el.style.transform = 'translateX(-20px)'; el.style.transition = 'all 0.3s'; }
                setTimeout(async () => {
                    const res = await fetch(`/api/comments/${commentId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) loadArticle();
                    else {
                        if (el) { el.style.opacity = '1'; el.style.transform = ''; }
                        const data = await res.json();
                        alert(data.message || 'Gagal menghapus.');
                    }
                }, 300);
            } catch {
                alert('Gagal terhubung ke server.');
            }
        }

        loadArticle();
    </script>
    <script src="push-init.js"></script>

    <!-- ===== SOCKET.IO REAL-TIME ===== -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Join room artikel ini
        if (articleId) {
            socket.emit('join-article', parseInt(articleId));

            // Identifikasi user
            if (token && currentUser) {
                socket.emit('user-join', currentUser);
            }
        }

        // ===== DENGERIN EVENT REAL-TIME =====

        // 1. Komentar baru real-time
        socket.on('new-comment', (data) => {
            if (data.articleId === parseInt(articleId)) {
                console.log('💬 Komentar baru real-time');
                renderComments(data.allComments);
            }
        });

        // 2. Like update real-time
        socket.on('like-updated', (data) => {
            if (data.articleId === parseInt(articleId)) {
                console.log('❤️ Like update real-time');
                updateLikeUI({
                    count: data.count,
                    liked: token ? (data.username === currentUser ? data.liked : document.getElementById('likeBtn').classList.contains('liked')) : false
                });
                // Update like count aja
                document.getElementById('likeCount').textContent = `${data.count} suka`;
            }
        });

        // 3. Komentar dihapus real-time
        socket.on('comment-deleted', (data) => {
            const el = document.getElementById(`comment-${data.commentId}`);
            if (el) {
                el.style.opacity = '0';
                el.style.transform = 'translateX(-20px)';
                el.style.transition = 'all 0.3s';
                setTimeout(() => {
                    el.remove();
                    // Update comment count
                    const currentCount = document.querySelectorAll('.comment-card').length;
                    document.getElementById('commentCount').textContent = currentCount;
                    if (currentCount === 0) {
                        document.getElementById('commentList').innerHTML = '<p class="empty-comment">Belum ada komentar. Jadilah yang pertama!</p>';
                    }
                }, 300);
            }
        });

        // 4. Artikel dihapus (balik ke index)
        socket.on('article-deleted', (data) => {
            if (data.articleId === parseInt(articleId)) {
                alert('Artikel ini telah dihapus.');
                location.href = 'index.html';
            }
        });

        // 5. User online
        socket.on('online-users', (users) => {
            console.log('👥 Online users:', users);
        });

        // Cleanup: leave room pas user tutup/pindah halaman
        window.addEventListener('beforeunload', () => {
            if (articleId) {
                socket.emit('leave-article', parseInt(articleId));
            }
        });

        console.log('🔌 Socket.IO real-time siap di artikel.html');
    </script>
