<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>for heal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            color: #2d2d2d;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            line-height: 1.7;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-7px); }
        }
        @keyframes bounceIn {
            0%   { opacity: 0; transform: scale(0.8) translateY(10px); }
            60%  { transform: scale(1.05) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%       { transform: scale(1.4); opacity: 0.7; }
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* PAGE TRANSITION */
        .page-transition {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .page-transition.active {
            opacity: 1;
            pointer-events: all;
        }

        /* === SAPAAN AI FULLSCREEN === */
        .ai-greeting {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            min-width: 100vw; min-height: 100vh;
            background:
                radial-gradient(ellipse 60% 50% at 20% 20%, #fff3e0 0%, transparent 65%),
                radial-gradient(ellipse 50% 45% at 80% 15%, #e8f5e9 0%, transparent 65%),
                radial-gradient(ellipse 55% 55% at 50% 70%, #e8eaf6 0%, transparent 65%),
                radial-gradient(ellipse 45% 40% at 85% 85%, #fce4ec 0%, transparent 65%),
                #fafafa;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            z-index: 9999;
            cursor: pointer;
            animation: fadeIn 0.4s ease forwards;
            -webkit-overflow-scrolling: touch;
        }
        .ai-greeting.visible { display: flex; }
        .ai-greeting-inner {
            padding: 24px;
            max-width: 480px;
            animation: fadeUp 0.6s ease 0.2s both;
        }
        .ai-greeting-emoji {
            font-size: 52px;
            margin-bottom: 24px;
            display: block;
            animation: floatY 3s ease-in-out infinite;
        }
        .ai-greeting-text {
            font-size: 32px;
            font-weight: 900;
            color: #2d2d2d;
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }
        .ai-greeting-sub {
            font-size: 14px;
            color: #bbb;
            font-weight: 600;
            margin-top: 40px;
            letter-spacing: 0.5px;
        }

        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f0ece8;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .logo {
            font-size: 19px;
            font-weight: 800;
            color: #2d2d2d;
            display: flex;
            align-items: center;
            gap: 7px;
            animation: slideInLeft 0.5s ease 0.1s both;
        }
        .nav-right {
            display: flex;
            gap: 8px;
            align-items: center;
            animation: fadeUp 0.5s ease 0.2s both;
        }
        .btn {
            background: #2d2d2d;
            color: #fff !important;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap;
            font-family: 'Nunito', sans-serif;
        }
        .btn:hover { opacity: 0.75; transform: translateY(-1px); }
        .btn:active { transform: scale(0.96); }
        .btn-outline {
            background: transparent;
            color: #888 !important;
            border: 1.5px solid #ddd;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Nunito', sans-serif;
        }
        .btn-outline:hover { border-color: #999; color: #444 !important; transform: translateY(-1px); }

        /* HERO */
        .hero {
            position: relative;
            text-align: center;
            padding: 64px 24px 80px;
            overflow: hidden;
            background:
                radial-gradient(ellipse 55% 45% at 8%  12%, #fff3e0 0%, transparent 70%),
                radial-gradient(ellipse 45% 40% at 92% 10%, #e8f5e9 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 50% 65%, #e8eaf6 0%, transparent 70%),
                radial-gradient(ellipse 40% 35% at 90% 88%, #fce4ec 0%, transparent 70%),
                radial-gradient(ellipse 35% 30% at 10% 85%, #e1f5fe 0%, transparent 70%),
                #fafafa;
        }

        /* floating dots */
        .dot {
            position: absolute;
            animation: floatY 3.8s ease-in-out infinite;
        }
        .dot.d1 { width:13px; height:13px; background:#f7b731; border-radius:50%;  top:57%; left:7%;   animation-delay:0s;   }
        .dot.d2 { width:11px; height: 8px; background:#f7e04e; border-radius:4px;  top:28%; left:13%;  animation-delay:.5s;  }
        .dot.d3 { width:11px; height:11px; background:#f4845f; border-radius:50%;  top:70%; left:26%;  animation-delay:.9s;  }
        .dot.d4 { width: 9px; height: 9px; background:#5dba8a; border-radius:50%;  top:82%; left:44%;  animation-delay:1.3s; }
        .dot.d5 { width:14px; height: 9px; background:#f7e04e; border-radius:4px;  top:57%; right:9%;  animation-delay:.6s;  }
        .dot.d6 { width:10px; height:10px; background:#f4845f; border-radius:50%;  top:37%; right:7%;  animation-delay:1.0s; }
        .dot.d7 { width:13px; height:13px; background:#6ec6f5; border-radius:3px;  top:75%; right:33%; animation-delay:.2s;  }
        .dot.d8 { width:12px; height:12px; background:#e05060; border-radius:3px;  top:83%; right:20%; animation-delay:1.5s; }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.82);
            border: 1.5px solid rgba(0,0,0,0.10);
            border-radius: 30px;
            padding: 7px 18px;
            font-size: 12px;
            font-weight: 800;
            color: #555;
            letter-spacing: 1.2px;
            margin-bottom: 32px;
            opacity: 0;
            animation: bounceIn 0.6s ease 0.2s forwards;
        }

        .hero h1 {
            font-size: 68px;
            font-weight: 900;
            line-height: 1.05;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.35s forwards;
        }
        .hero h1 .word1 {
            display: block;
            background: linear-gradient(90deg, #f4845f 0%, #f7b731 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero h1 .word2 {
            display: block;
            background: linear-gradient(90deg, #5b8dee 0%, #7ec8c8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: #888;
            font-size: 16px;
            font-weight: 500;
            max-width: 380px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.5s forwards;
        }

        /* ACTION BAR */
        .action-bar {
            display: none;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 40px 20px 0;
        }
        .action-bar a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            padding: 10px 24px;
            border: 2px solid;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Nunito', sans-serif;
            opacity: 0;
            animation: bounceIn 0.5s ease forwards;
        }
        .action-bar a:nth-child(1) { animation-delay: 0.1s; }
        .action-bar a:nth-child(2) { animation-delay: 0.2s; }
        .action-bar a:nth-child(3) { animation-delay: 0.3s; }
        .action-bar a:nth-child(4) { animation-delay: 0.4s; }
        .action-bar a:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 20px rgba(0,0,0,0.10);
        }
        .action-bar a:active { transform: scale(0.96); }
        .action-bar a.btn-tulis  { background: #fff0f3; color: #e05575; border-color: #f7b8c8; }
        .action-bar a.btn-til    { background: #f0fdf4; color: #2d9e6b; border-color: #90ddb8; }
        .action-bar a.btn-quotes { background: #f5f0ff; color: #7c3aed; border-color: #c4a8f0; }
        .action-bar a.btn-voice  { background: #fff5f0; color: #c05a30; border-color: #f5b89a; }

        /* CONTAINER */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }

        .section-title {
            font-size: 11px;
            letter-spacing: 2.5px;
            color: #aaa;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0ece8;
        }

        /* POST CARD — scroll reveal */
        .post-card {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            padding: 22px 0;
            border-bottom: 1px solid #f4f0ec;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            opacity: 0;
            transform: translateY(24px);
        }
        .post-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.25s ease;
        }
        .post-card:hover {
            transform: translateX(5px);
        }

        /* RIPPLE */
        .ripple-el {
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.06);
            width: 60px;
            height: 60px;
            margin-top: -30px;
            margin-left: -30px;
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        .post-thumb {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            object-fit: cover;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .post-card:hover .post-thumb { transform: scale(1.04); }

        .post-thumb-placeholder {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            transition: transform 0.3s ease;
        }
        .post-card:hover .post-thumb-placeholder { transform: scale(1.04); }

        .post-body { flex: 1; min-width: 0; padding-top: 2px; }

        .post-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 5px;
        }
        .tag-refleksi { color: #e05060; }
        .tag-cerita   { color: #3b9dcf; }
        .tag-opini    { color: #8059d0; }
        .tag-lifestyle{ color: #c07020; }
        .tag-default  { color: #888; }

        .post-card h2 {
            font-size: 17px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 6px;
            line-height: 1.35;
        }
        .post-excerpt {
            color: #aaa;
            font-size: 13.5px;
            font-weight: 500;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .post-meta {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
            font-weight: 600;
            flex-wrap: wrap;
            align-items: center;
        }

        .empty {
            text-align: center;
            color: #bbb;
            padding: 60px 0;
            font-size: 15px;
            font-weight: 600;
        }

        /* SKELETON LOADER */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-card {
            display: flex;
            gap: 18px;
            padding: 22px 0;
            border-bottom: 1px solid #f4f0ec;
        }
        .skeleton-thumb {
            width: 90px; height: 90px;
            border-radius: 16px;
            flex-shrink: 0;
        }
        .skeleton-body { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
        .skeleton-line { height: 12px; border-radius: 6px; }

        /* FOOTER DOTS */
        .footer-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .footer-dots span:nth-child(1) { animation: pulseDot 1.8s ease-in-out 0s infinite; }
        .footer-dots span:nth-child(2) { animation: pulseDot 1.8s ease-in-out 0.2s infinite; }
        .footer-dots span:nth-child(3) { animation: pulseDot 1.8s ease-in-out 0.4s infinite; }
        .footer-dots span:nth-child(4) { animation: pulseDot 1.8s ease-in-out 0.6s infinite; }
        .footer-dots span:nth-child(5) { animation: pulseDot 1.8s ease-in-out 0.8s infinite; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 36px 20px;
            border-top: 1px solid #f4f0ec;
            font-size: 13px;
            color: #bbb;
            font-weight: 600;
        }
        .footer-dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            nav { padding: 14px 16px; }
            .hero { padding: 48px 16px 60px; }
            .hero h1 { font-size: 44px; }
            .action-bar { gap: 10px; padding: 24px 16px 0; }
            .action-bar a { font-size: 13px; padding: 8px 18px; }
            .container { padding: 36px 16px 60px; }
            .post-thumb, .post-thumb-placeholder { width: 72px; height: 72px; font-size: 24px; }
            .post-card h2 { font-size: 15px; }
        }

        @media (max-width: 600px) {
            nav {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(255,255,255,0.98);
            }
            .post-card { will-change: transform; }
            .ai-greeting { will-change: opacity; }
            .dot { animation: none; opacity: 0.5; }
            .hero {
                background:
                    radial-gradient(ellipse 70% 60% at 20% 30%, #fff3e0 0%, transparent 70%),
                    radial-gradient(ellipse 60% 50% at 80% 70%, #e8eaf6 0%, transparent 70%),
                    #fafafa;
            }
            .post-card { animation-delay: 0s !important; }
        }
    </style>
</head>
<body>

    <!-- PAGE TRANSITION OVERLAY -->
    <div class="page-transition" id="pageTransition"></div>

    <!-- SAPAAN AI FULLSCREEN -->
    <div id="aiGreeting" class="ai-greeting" onclick="closeGreeting()">
        <div class="ai-greeting-inner">
            <span class="ai-greeting-emoji" id="aiEmoji">🌿</span>
            <div class="ai-greeting-text" id="aiText"></div>
            <p class="ai-greeting-sub">klik di mana saja untuk lanjut</p>
        </div>
    </div>

    <nav>
        <div class="logo">
            <svg width="34" height="34" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#c97d4e" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M100 148 C80 132,56 116,56 92 C56 75,69 64,82 64 C89 64,96 68,100 74 C104 68,111 64,118 64 C131 64,144 75,144 92 C144 116,120 132,100 148Z" stroke-width="1.4" opacity="0.9"/>
                    <path d="M100 138 C82 123,64 109,64 90 C64 76,75 67,86 67 C92 67,98 71,100 77 C102 71,108 67,114 67 C125 67,136 76,136 90 C136 109,118 123,100 138Z" stroke-width="1.2" opacity="0.65"/>
                    <path d="M100 128 C85 115,72 104,72 89 C72 78,80 71,89 71 C94 71,98 74,100 79 C102 74,106 71,111 71 C120 71,128 78,128 89 C128 104,115 115,100 128Z" stroke-width="1" opacity="0.4"/>
                </g>
            </svg>
            for heal
        </div>
        <div class="nav-right">
            <div id="guestNav" style="display:flex;gap:8px;">
                <a href="login.html" class="btn-outline">Masuk</a>
                <a href="register.html" class="btn">Daftar</a>
            </div>
            <div id="userNav" style="display:none;gap:8px;align-items:center;">
                <a href="admin.html" id="adminBtn" style="display:none;color:#f4845f;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;">⚙️ Admin</a>
                <span id="usernameDisplay" style="color:#999;font-size:14px;font-weight:600;white-space:nowrap;"></span>
                <a href="#" onclick="logout()" class="btn">Keluar</a>
            </div>
        </div>
    </nav>

    <div class="hero">
        <div class="dot d1"></div><div class="dot d2"></div>
        <div class="dot d3"></div><div class="dot d4"></div>
        <div class="dot d5"></div><div class="dot d6"></div>
        <div class="dot d7"></div><div class="dot d8"></div>

        <div class="hero-badge">I LOVE U </div>
        <h1>
            <span class="word1">menuang</span>
            <span class="word2">isi kepala</span>
        </h1>
        <p>biar ga stress aja ini — tulis, cerita, rekam, bebas mau apa aja</p>
    </div>

    <div class="action-bar" id="actionBar">
        <a href="tulis.html"     class="btn-tulis">✏️ Tulis</a>
        <a href="til.html"       class="btn-til">📓 TIL</a>
        <a href="quotes.html"    class="btn-quotes">💬 Quotes</a>
        <a href="voicenote.html" class="btn-voice">🎙️ Voice</a>
    </div>

    <div class="container">
        <p class="section-title">Tulisan Terbaru</p>
        <div id="articleList">
            <!-- skeleton loading -->
            ${[1,2,3].map(() => `
            <div class="skeleton-card">
                <div class="skeleton skeleton-thumb"></div>
                <div class="skeleton-body">
                    <div class="skeleton skeleton-line" style="width:40%"></div>
                    <div class="skeleton skeleton-line" style="width:80%"></div>
                    <div class="skeleton skeleton-line" style="width:60%"></div>
                    <div class="skeleton skeleton-line" style="width:30%"></div>
                </div>
            </div>`).join('')}
        </div>
    </div>

    <footer>
        <div class="footer-dots">
            <span style="background:#f7a8b8"></span>
            <span style="background:#f7b731"></span>
            <span style="background:#a8e6cf"></span>
            <span style="background:#a0c4ff"></span>
            <span style="background:#c9b1ff"></span>
        </div>
        <p>made with my hand — for heal</p>
    </footer>

    <script>
        const token    = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        window.addEventListener('pageshow', (e) => {
            const overlay = document.getElementById('pageTransition');
            overlay.classList.remove('active');
        });

        if (token) {
            document.getElementById('guestNav').style.display = 'none';
            document.getElementById('userNav').style.display  = 'flex';
            document.getElementById('usernameDisplay').innerHTML =
                `<a href="profile.html" style="color:#999;font-size:14px;font-weight:600;text-decoration:none;">👤 ${username}</a>`;
            document.getElementById('actionBar').style.display = 'flex';
            if (username === 'arekujo001') {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            location.reload();
        }

        // ===== PAGE TRANSITION =====
        function navigateTo(url) {
            const overlay = document.getElementById('pageTransition');
            overlay.classList.add('active');
            setTimeout(() => { location.href = url; }, 280);
        }

        // ===== RIPPLE EFFECT =====
        function addRipple(e, el) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple-el');
            const rect = el.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top  = (e.clientY - rect.top) + 'px';
            el.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // ===== SCROLL REVEAL =====
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

        const tagClass = {
            refleksi:  'tag-refleksi',
            cerita:    'tag-cerita',
            opini:     'tag-opini',
            lifestyle: 'tag-lifestyle',
        };

        const thumbs = [
            { bg: '#ffd6d6', emoji: '🔎' },
            { bg: '#d6eeff', emoji: '🐶' },
            { bg: '#fffbd6', emoji: '👻' },
            { bg: '#e8d6ff', emoji: '🐾' },
        ];

        async function loadArticles() {
            try {
                const res      = await fetch('/api/articles');
                const articles = await res.json();
                const list     = document.getElementById('articleList');

                if (!articles.length) {
                    list.innerHTML = '<p class="empty">Belum ada artikel. Jadilah yang pertama menulis!</p>';
                    return;
                }

                list.innerHTML = articles.map((a, i) => {
                    const key = (a.tag || '').toLowerCase();
                    const cls = tagClass[key] || 'tag-default';
                    const t   = thumbs[i % thumbs.length];
                    const img = a.image_url
                        ? `<img src="${a.image_url}" class="post-thumb" />`
                        : `<div class="post-thumb-placeholder" style="background:${t.bg}">${t.emoji}</div>`;

                    return `
                      <div class="post-card" data-url="artikel.html?id=${a.id}">
                        ${img}
                        <div class="post-body">
                          <p class="post-tag ${cls}">${a.tag}</p>
                          <h2>${a.title}</h2>
                          <p class="post-excerpt">${a.content.substring(0, 120)}...</p>
                          <div class="post-meta">
                            <a href="profile.html?u=${a.author}" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#aaa;font-size:12px;font-weight:700;">
                                ${a.avatar_url
                                    ? `<img src="${a.avatar_url}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;">`
                                    : `<span style="width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#f4845f,#f7b731);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;">${a.author.charAt(0).toUpperCase()}</span>`
                                }
                                ${a.author}
                            </a>
                            <span>📅 ${a.date}</span>
                            <span>💬 ${a.comments.length} komentar</span>
                          </div>
                        </div>
                      </div>`;
                }).join('');

                // attach scroll reveal + ripple + page transition
                document.querySelectorAll('.post-card').forEach(card => {
                    observer.observe(card);

                    card.addEventListener('click', (e) => {
                        addRipple(e, card);
                        const url = card.dataset.url;
                        if (url) setTimeout(() => navigateTo(url), 120);
                    });
                });

            } catch(e) {
                console.error('Gagal load artikel:', e);
            }
        }

        loadArticles();

        // action bar link transition
        document.querySelectorAll('.action-bar a').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                navigateTo(a.getAttribute('href'));
            });
        });

        /* === SAPAAN AI FULLSCREEN === */

            { text: "mau cerita random\njuga gapapa loh",                  emoji: "🎈" },

    <!-- ===== SOCKET.IO REAL-TIME ===== -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ===== INISIALISASI SOCKET =====
        const socket = io({
            transports: ['websocket', 'polling'],
            upgrade: true
        });

        // Identifikasi user kalau udah login
        if (token && username) {
            socket.emit('user-join', username);
        }

        // ===== DENGERIN EVENT REAL-TIME =====

        // 1. Artikel baru langsung muncul di feed
        socket.on('new-article', async (data) => {
            console.log('📝 Artikel baru real-time:', data.article.title);
            
            // Ambil avatar dari server
            let avatarHtml = '';
            try {
                const res = await fetch(`/api/user/${data.article.author}`);
                const userData = await res.json();
                avatarHtml = userData.avatar_url
                    ? `<img src="${userData.avatar_url}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;">`
                    : `<span style="width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#f4845f,#f7b731);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;">${data.article.author.charAt(0).toUpperCase()}</span>`;
            } catch {
                avatarHtml = `<span style="width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#f4845f,#f7b731);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;">${data.article.author.charAt(0).toUpperCase()}</span>`;
            }

            const key = (data.article.tag || '').toLowerCase();
            const cls = tagClass[key] || 'tag-default';
            const t = thumbs[Math.floor(Math.random() * thumbs.length)];
            const img = data.article.image_url
                ? `<img src="${data.article.image_url}" class="post-thumb" />`
                : `<div class="post-thumb-placeholder" style="background:${t.bg}">${t.emoji}</div>`;

            // Buat card baru
            const newCard = document.createElement('div');
            newCard.className = 'post-card visible';
            newCard.setAttribute('data-url', `artikel.html?id=${data.article.id}`);
            newCard.innerHTML = `
                ${img}
                <div class="post-body">
                    <p class="post-tag ${cls}">${data.article.tag}</p>
                    <h2>${data.article.title}</h2>
                    <p class="post-excerpt">${(data.article.content || '').substring(0, 120)}...</p>
                    <div class="post-meta">
                        <a href="profile.html?u=${data.article.author}" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#aaa;font-size:12px;font-weight:700;">
                            ${avatarHtml}
                            ${data.article.author}
                        </a>
                        <span>📅 ${data.article.date}</span>
                        <span>💬 0 komentar</span>
                    </div>
                </div>
            `;

            // Tambahin ke paling atas list
            const list = document.getElementById('articleList');
            const emptyMsg = list.querySelector('.empty');
            if (emptyMsg) emptyMsg.remove();
            
            list.insertBefore(newCard, list.firstChild);

            // Attach event listener ke card baru
            newCard.addEventListener('click', (e) => {
                addRipple(e, newCard);
                const url = newCard.dataset.url;
                if (url) setTimeout(() => navigateTo(url), 120);
            });

            // Observe untuk scroll reveal
            observer.observe(newCard);
        });

        // 2. Artikel dihapus langsung hilang dari feed
        socket.on('article-deleted', (data) => {
            console.log('🗑️ Artikel dihapus real-time:', data.articleId);
            const card = document.querySelector(`[data-url="artikel.html?id=${data.articleId}"]`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                setTimeout(() => {
                    card.remove();
                    // Cek apakah list kosong
                    const list = document.getElementById('articleList');
                    if (!list.querySelector('.post-card')) {
                        list.innerHTML = '<p class="empty">Belum ada artikel. Jadilah yang pertama menulis!</p>';
                    }
                }, 300);
            }
        });

        // 3. Update komentar real-time di index
        setInterval(async () => {
            const cards = document.querySelectorAll('.post-card');
            for (const card of cards) {
                const url = card.getAttribute('data-url');
                if (!url) continue;
                const articleId = url.split('id=')[1];
                if (!articleId) continue;
        
                try {
                    const res = await fetch(`/api/articles/${articleId}`);
                    const article = await res.json();
                    const metaSpans = card.querySelectorAll('.post-meta span');
                    metaSpans.forEach(span => {
                        if (span.textContent.includes('komentar')) {
                            span.textContent = `💬 ${article.comments.length} komentar`;
                        }
                    });
                } catch(e) {}
            }
        }, 5000);

        // 4. Lihat user online
        socket.on('online-users', (users) => {
            console.log('👥 Online users:', users);
        });

        console.log('🔌 Socket.IO real-time siap di index.html');
    </script>
