<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pribadiku</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; line-height: 1.7; opacity: 0; animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; border-bottom: 1px solid #222; }
        nav .logo { font-size: 20px; font-weight: 600; color: #fff; }
        nav ul { list-style: none; display: flex; gap: 20px; align-items: center; }
        nav ul a { color: #aaa; text-decoration: none; font-size: 15px; transition: color 0.2s; }
        nav ul a:hover { color: #fff; }
        .btn { background: #fff; color: #000; padding: 8px 18px; border-radius: 6px; font-size: 14px; font-weight: 500; text-decoration: none; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; color: #000; }
        .btn-outline { background: transparent; color: #aaa; border: 1px solid #333; padding: 8px 18px; border-radius: 6px; font-size: 14px; text-decoration: none; transition: all 0.2s; }
        .btn-outline:hover { border-color: #fff; color: #fff; }
        .hero { text-align: center; padding: 80px 20px 60px; border-bottom: 1px solid #222; }
        .hero h1 { font-size: 42px; color: #fff; font-weight: 600; margin-bottom: 12px; opacity: 0; animation: fadeUp 0.7s ease 0.3s forwards; }
        .hero p { color: #888; font-size: 17px; opacity: 0; animation: fadeUp 0.7s ease 0.5s forwards; }
        .container { max-width: 720px; margin: 0 auto; padding: 60px 20px; }
        .section-title { font-size: 13px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 30px; }
        .post-card { border-bottom: 1px solid #1e1e1e; padding: 30px 0; cursor: pointer; transition: transform 0.3s ease, padding-left 0.3s ease; opacity: 0; animation: fadeUp 0.6s ease forwards; }
        .post-card:hover { transform: translateY(-4px); padding-left: 12px; }
        .post-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 16px; }
        .post-tag { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .post-card h2 { font-size: 20px; color: #fff; font-weight: 500; margin-bottom: 10px; }
        .post-card p { color: #777; font-size: 15px; }
        .post-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: #444; }
        .empty { text-align: center; color: #444; padding: 60px 0; font-size: 16px; }
        footer { text-align: center; padding: 40px; border-top: 1px solid #1e1e1e; color: #444; font-size: 13px; }
        #userNav { display: none; gap: 20px; align-items: center; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">✦ Blog Pribadi</div>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <div id="guestNav">
                <li><a href="login.html" class="btn-outline">Masuk</a></li>
                <li><a href="register.html" class="btn">Daftar</a></li>
            </div>
            <div id="userNav">
                <li><a href="tulis.html" class="btn-outline">✏️ Tulis</a></li>
                <li><span id="usernameDisplay" style="color:#aaa; font-size:14px;"></span></li>
                <li><a href="#" onclick="logout()" class="btn">Keluar</a></li>
            </div>
        </ul>
    </nav>

    <div class="hero">
        <h1>Cerita & Opini Pribadi</h1>
        <p>Tempat menuangkan pikiran dan perasaan.</p>
    </div>

    <div class="container">
        <p class="section-title">Tulisan Terbaru</p>
        <div id="articleList"><p class="empty">Belum ada artikel. Jadilah yang pertama menulis!</p></div>
    </div>

    <footer><p>Dibuat dengan ❤ · 2026</p></footer>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (token) {
            document.getElementById('guestNav').style.display = 'none';
            document.getElementById('userNav').style.display = 'flex';
            document.getElementById('usernameDisplay').textContent = '👤 ' + username;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            location.reload();
        }

        async function loadArticles() {
            const res = await fetch('/api/articles');
            const articles = await res.json();
            const list = document.getElementById('articleList');
            if (articles.length === 0) {
                list.innerHTML = '<p class="empty">Belum ada artikel. Jadilah yang pertama menulis!</p>';
                return;
            }
            list.innerHTML = articles.map((a, i) => `
                <div class="post-card" style="animation-delay:${i * 0.15}s" onclick="location.href='artikel.html?id=${a.id}'">
                    ${a.image_url ? `<img src="${a.image_url}" class="post-cover" />` : ''}
                    <p class="post-tag">${a.tag}</p>
                    <h2>${a.title}</h2>
                    <p>${a.content.substring(0, 120)}...</p>
                    <div class="post-meta">
                        <span>✍️ ${a.author}</span>
                        <span>📅 ${a.date}</span>
                        <span>💬 ${a.comments.length} komentar</span>
                    </div>
                </div>
            `).join('');
        }

        loadArticles();
    </script>
</body>
</html>
