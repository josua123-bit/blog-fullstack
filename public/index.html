<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>for heal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; line-height: 1.7; opacity: 0; animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #222; }
        nav .logo { font-size: 22px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .nav-right { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }

        .btn { background: #fff; color: #000 !important; padding: 8px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; transition: opacity 0.2s; white-space: nowrap; }
        .btn:hover { opacity: 0.8; }
        .btn-outline { background: transparent; color: #aaa !important; border: 1px solid #444; padding: 8px 20px; border-radius: 6px; font-size: 14px; text-decoration: none; transition: all 0.2s; white-space: nowrap; }
        .btn-outline:hover { border-color: #fff; color: #fff !important; }

        .hero { text-align: center; padding: 80px 20px 50px; border-bottom: 1px solid #222; }
        .hero h1 { font-size: 42px; color: #fff; font-weight: 600; margin-bottom: 12px; opacity: 0; animation: fadeUp 0.7s ease 0.3s forwards; }
        .hero p { color: #888; font-size: 17px; opacity: 0; animation: fadeUp 0.7s ease 0.5s forwards; }

        .action-bar { display: none; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 28px 20px 0; }
        .action-bar a {
            display: inline-flex; align-items: center; gap: 6px;
            color: #aaa; font-size: 14px; text-decoration: none;
            border: 1px solid #2a2a2a; border-radius: 8px;
            padding: 8px 16px; transition: all 0.2s;
            background: #161616; white-space: nowrap;
        }
        .action-bar a:hover { color: #fff; border-color: #555; background: #1e1e1e; }
        .action-bar a.primary { background: #fff; color: #000 !important; border-color: #fff; font-weight: 600; }
        .action-bar a.primary:hover { opacity: 0.85; }

        .container { max-width: 720px; margin: 0 auto; padding: 60px 20px; }
        .section-title { font-size: 13px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 30px; }
        .post-card { border-bottom: 1px solid #1e1e1e; padding: 30px 0; cursor: pointer; transition: transform 0.3s ease, padding-left 0.3s ease; opacity: 0; animation: fadeUp 0.6s ease forwards; }
        .post-card:hover { transform: translateY(-4px); padding-left: 12px; }
        .post-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 16px; }
        .post-tag { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .post-card h2 { font-size: 20px; color: #fff; font-weight: 500; margin-bottom: 10px; }
        .post-card p { color: #777; font-size: 15px; }
        .post-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: #444; flex-wrap: wrap; }
        .empty { text-align: center; color: #444; padding: 60px 0; font-size: 16px; }
        footer { text-align: center; padding: 40px; border-top: 1px solid #1e1e1e; color: #444; font-size: 13px; }

        @media (max-width: 768px) {
            nav { padding: 14px 16px; }
            nav .logo { font-size: 18px; }
            .btn, .btn-outline { padding: 6px 14px; font-size: 13px; }
            .hero { padding: 50px 20px 40px; }
            .hero h1 { font-size: 26px; }
            .hero p { font-size: 14px; }
            .action-bar { gap: 8px; padding: 20px 16px 0; }
            .action-bar a { font-size: 13px; padding: 7px 13px; }
            .container { padding: 30px 16px; }
            .post-card h2 { font-size: 17px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 200 200" role="img" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#c97d4e" stroke-linecap="round" stroke-linejoin="round">
                <path d="M100 148 C80 132, 56 116, 56 92 C56 75, 69 64, 82 64 C89 64, 96 68, 100 74 C104 68, 111 64, 118 64 C131 64, 144 75, 144 92 C144 116, 120 132, 100 148 Z" stroke-width="1.2" opacity="0.9"/>
                <path d="M100 140 C82 125, 63 111, 63 90 C63 76, 74 67, 85 67 C91 67, 97 70, 100 76 C103 70, 109 67, 115 67 C126 67, 137 76, 137 90 C137 111, 118 125, 100 140 Z" stroke-width="1.2" opacity="0.75"/>
                <path d="M100 132 C84 118, 70 106, 70 89 C70 77, 79 70, 88 70 C93 70, 98 73, 100 78 C102 73, 107 70, 112 70 C121 70, 130 77, 130 89 C130 106, 116 118, 100 132 Z" stroke-width="1.2" opacity="0.6"/>
                <path d="M100 124 C86 111, 77 101, 77 88 C77 78, 84 73, 91 73 C95 73, 99 76, 100 80 C101 76, 105 73, 109 73 C116 73, 123 78, 123 88 C123 101, 114 111, 100 124 Z" stroke-width="1.2" opacity="0.45"/>
                <path d="M100 116 C88 104, 84 96, 84 87 C84 80, 89 76, 94 76 C97 76, 99 78, 100 82 C101 78, 103 76, 106 76 C111 76, 116 80, 116 87 C116 96, 112 104, 100 116 Z" stroke-width="1.2" opacity="0.3"/>
            </g>
        </svg>
        for heal
    </div>
        <div class="nav-right">
            <!-- Guest -->
            <div id="guestNav" style="display:flex; gap:8px;">
                <a href="login.html" class="btn-outline">Masuk</a>
                <a href="register.html" class="btn">Daftar</a>
            </div>
            <!-- User (logged in) -->
            <div id="userNav" style="display:none; gap:8px; align-items:center;">
                <a href="admin.html" id="adminBtn" style="display:none; color:#7c83fd; font-size:14px; text-decoration:none; white-space:nowrap;">⚙️ Admin</a>
                <span id="usernameDisplay" style="color:#666; font-size:14px; white-space:nowrap;"></span>
                <a href="#" onclick="logout()" class="btn">Keluar</a>
            </div>
        </div>
    </nav>

    <div class="hero">
        <h1>tempat menuang isi kepala</h1>
        <p>biar ga stress aja ini</p>
    </div>

    <!-- Tombol aksi — hanya muncul saat login -->
    <div class="action-bar" id="actionBar">
        <a href="tulis.html" class="primary">✏️ Tulis</a>
        <a href="til.html">📓 TIL</a>
        <a href="quotes.html">💬 Quotes</a>
        <a href="voicenote.html">🎙️ Voice</a>
    </div>

    <div class="container">
        <p class="section-title">Tulisan Terbaru</p>
        <div id="articleList"><p class="empty">Belum ada artikel. Jadilah yang pertama menulis!</p></div>
    </div>

    <footer><p>made with my hand</p></footer>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (token) {
            document.getElementById('guestNav').style.display = 'none';
            document.getElementById('userNav').style.display = 'flex';
            document.getElementById('usernameDisplay').textContent = '👤 ' + username;
            document.getElementById('actionBar').style.display = 'flex';
            if (username === 'arekujo001') {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            location.reload();
        }

        async function loadArticles() {
            try {
                const res = await fetch('/api/articles');
                const articles = await res.json();
                const list = document.getElementById('articleList');
                if (articles.length === 0) {
                    list.innerHTML = '<p class="empty">Belum ada artikel. Jadilah yang pertama menulis!</p>';
                    return;
                }
                list.innerHTML = articles.map((a, i) => `
                    <div class="post-card" style="animation-delay:${i * 0.15}s" onclick="location.href='artikel.html?id=${a.id}'">
                        ${a.image_url ? `<img src="${a.image_url}" class="post-cover" />` : ''}
                        <p class="post-tag">${a.tag}</p>
                        <h2>${a.title}</h2>
                        <p>${a.content.substring(0, 120)}...</p>
                        <div class="post-meta">
                            <span>✍️ ${a.author}</span>
                            <span>📅 ${a.date}</span>
                            <span>💬 ${a.comments.length} komentar</span>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                console.error('Gagal load artikel:', e);
            }
        }

        loadArticles();
    </script>
    <script src="push-init.js"></script>  <!-- tambah di sini -->
</body>
</html>
