<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Masuk — for heal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background:
                radial-gradient(ellipse 55% 45% at 8%  12%, #fff3e0 0%, transparent 70%),
                radial-gradient(ellipse 45% 40% at 92% 10%, #e8f5e9 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 50% 90%, #e8eaf6 0%, transparent 70%),
                radial-gradient(ellipse 40% 35% at 90% 88%, #fce4ec 0%, transparent 70%),
                #fafafa;
            color: #2d2d2d;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f0ece8;
        }
        nav .logo {
            font-size: 19px;
            font-weight: 800;
            color: #2d2d2d;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* CENTER */
        .center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* CARD */
        .card {
            background: rgba(255,255,255,0.92);
            border: 2px solid #f0ece8;
            border-radius: 24px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        .card-icon {
            font-size: 36px;
            text-align: center;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 26px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .card .subtitle {
            color: #bbb;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 32px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
            margin-top: 18px;
        }

        input {
            width: 100%;
            background: #fafafa;
            border: 2px solid #f0ece8;
            border-radius: 14px;
            padding: 13px 16px;
            color: #2d2d2d;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        input:focus {
            border-color: #c9b1ff;
            box-shadow: 0 0 0 4px rgba(201,177,255,0.12);
            background: #fff;
        }
        input::placeholder { color: #ccc; font-weight: 500; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #b388ff, #c9b1ff);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 28px;
            transition: opacity 0.2s, transform 0.2s;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.3px;
        }
        .submit-btn:hover { opacity: 0.88; transform: translateY(-2px); }

        .error {
            color: #e05060;
            font-size: 13px;
            font-weight: 700;
            margin-top: 14px;
            display: none;
            text-align: center;
            background: #fff0f2;
            border: 1.5px solid #ffc0cc;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .footer-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #bbb;
        }
        .footer-link a {
            color: #b388ff;
            text-decoration: none;
            font-weight: 800;
        }
        .footer-link a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            nav { padding: 14px 16px; }
            .card { padding: 32px 24px; border-radius: 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <svg width="28" height="28" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#c97d4e" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M100 148 C80 132,56 116,56 92 C56 75,69 64,82 64 C89 64,96 68,100 74 C104 68,111 64,118 64 C131 64,144 75,144 92 C144 116,120 132,100 148Z" stroke-width="1.4" opacity="0.9"/>
                    <path d="M100 138 C82 123,64 109,64 90 C64 76,75 67,86 67 C92 67,98 71,100 77 C102 71,108 67,114 67 C125 67,136 76,136 90 C136 109,118 123,100 138Z" stroke-width="1.2" opacity="0.65"/>
                </g>
            </svg>
            for heal
        </a>
    </nav>

    <div class="center">
        <div class="card">
            <div class="card-icon">🚪</div>
            <h2>Selamat datang</h2>
            <p class="subtitle">Masuk dan lanjutkan ceritamu.</p>

            <label>Username</label>
            <input type="text" id="username" placeholder="username kamu" />

            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />

            <p class="error" id="errorMsg"></p>

            <button class="submit-btn" onclick="login()">Masuk →</button>

            <div class="footer-link">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!username || !password) {
                errorMsg.textContent = 'Username dan password wajib diisi!';
                errorMsg.style.display = 'block';
                return;
            }
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                location.href = 'index.html';
            } catch {
                errorMsg.textContent = 'Gagal terhubung ke server.';
                errorMsg.style.display = 'block';
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
